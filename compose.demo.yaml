name: harness-admin-demo

x-backend-build: &backend-build
  context: .
  target: backend

x-backend-environment: &backend-environment
  APP_ENV: development
  AUTO_MIGRATE: "true"
  DATABASE_URL: postgres://harness:harness@postgres:5432/harness_admin?sslmode=disable
  REDIS_ADDR: redis:6379

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harness_admin
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "harness", "-d", "harness_admin"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  bootstrap:
    build: *backend-build
    environment:
      <<: *backend-environment
      BOOTSTRAP_ORG_CODE: demo
      BOOTSTRAP_ORG_NAME: 演示企业
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: demo-admin
      BOOTSTRAP_PLATFORM_ADMIN_USERNAME: platform-admin
      BOOTSTRAP_PLATFORM_ADMIN_PASSWORD: demo-platform
    command: ["/bin/sh", "-ec", "bootstrap-admin && bootstrap-platform-admin"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: *backend-build
    environment:
      <<: *backend-environment
      HTTP_ADDR: ":8080"
      DRAMA_MEDIA_DIRECTORY: /app/data/drama-media
      OIDC_ISSUER: http://127.0.0.1:${HARNESS_DEMO_PORT:-18080}
      CONSOLE_URL: http://127.0.0.1:${HARNESS_DEMO_PORT:-18080}
    volumes:
      - app_data:/app/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      target: frontend
      args:
        npm_config_registry: ${HARNESS_DEMO_NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "127.0.0.1:${HARNESS_DEMO_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  redis_data:
  app_data:
