        transport: { type: string, enum: [streamable_http] }
    MCPConnectionEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MCPConnection' }
    CreatedMCPConnectionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          allOf:
