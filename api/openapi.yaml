      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DramaBatchRangeChange' }
      responses:
        '200':
          description: 更新后的批次。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 批次版本已变化，请刷新后重试。 }
  /ai-drama/projects/{id}/batches/{batchId}/analyze:
    post:
      summary: 从头启动或重新解析批次，清空当前阶段检查点
