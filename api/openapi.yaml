    MCPTool:
      type: object
      required: [name, description, inputSchema, discoveredAt]
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        discoveredAt: { type: string, format: date-time }
    MCPUpstreamRequest:
      type: object
      properties:
        connectionId: { type: string, format: uuid, description: 可选；用于发现和测试工具的有效连接，必须属于当前服务。 }
        parameters:
          type: array
          description: 仅用于本次发现或测试，不会持久化。
          items: { $ref: '#/components/schemas/MCPParameterValue' }
        authorization: { type: string, description: 可选的完整上游 Authorization 值，仅用于本次请求。 }
        headerName: { type: string, description: 可选的上游请求头名称；须与值同时填写。 }
        headerValue: { type: string, description: 可选的上游请求头值，仅用于本次请求。 }
        queryName: { type: string, description: 可选的上游 URL 参数名；须与值同时填写。 }
        queryValue: { type: string, description: 可选的上游 URL 参数值，仅用于本次请求。 }
    MCPToolTestRequest:
      allOf:
        - { $ref: '#/components/schemas/MCPUpstreamRequest' }
        - type: object
          required: [name, arguments]
          properties:
            name: { type: string }
            arguments: { type: object, additionalProperties: true }
    MCPServiceEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MCPService' }
    MCPServiceListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MCPService' }
    MCPToolListEnvelope:
      type: object
      required: [data]
