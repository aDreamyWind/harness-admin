          description: 已更新的批次。
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/DramaBatch' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-drama/projects/{id}/batches/{batchId}/range:
    patch:
      summary: 修改批次的原文范围
