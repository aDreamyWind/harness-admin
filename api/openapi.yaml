        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPRepositoryImportInput' }
      responses:
        '202':
          description: 已创建 building 构建记录；后台解析固定提交并构建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPDeploymentResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /mcp-deployments/{serviceId}/versions/github:
    post:
      summary: 为已停止的托管 MCP 构建新 GitHub 版本
      operationId: buildMCPGitHubVersion
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPGitHubImportInput' }
      responses:
        '202':
          description: 已创建 building 构建记录；后台执行构建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPDeploymentResultEnvelope' }
  /mcp-deployments/{serviceId}/versions/upload:
    post:
      summary: 为已停止的托管 MCP 上传并构建新版本
      operationId: buildMCPUploadVersion
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MCPUploadImportInput' }
      responses:
        '202':
          description: 已创建 building 构建记录；后台执行构建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPDeploymentResultEnvelope' }
  /mcp-deployments/{serviceId}/runtime:
    get:
      summary: 查看托管容器状态和最近日志
      operationId: getMCPRuntimeStatus
      security: [{ sessionCookie: [] }]
