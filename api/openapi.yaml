            scenes: { type: array, items: { $ref: '#/components/schemas/DramaCatalogAsset' } }
            props: { type: array, items: { $ref: '#/components/schemas/DramaCatalogAsset' } }
        episodes: { type: array, items: { $ref: '#/components/schemas/DramaScriptEpisode' } }
    DramaBatchSelection:
      type: object
