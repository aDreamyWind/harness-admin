      type: object
      required: [location, name, value]
      properties:
        location: { type: string, enum: [header, query, path] }
        name: { type: string }
        value: { type: string, description: 上游参数值。 }
    MCPService:
      type: object
      required: [id, code, name, description, transport, upstreamUrl, parameters, status, sourceType, credentialsConfigured, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string, description: Markdown 服务描述。 }
        transport: { type: string, enum: [streamable_http, sse, stdio] }
        upstreamUrl: { type: string, description: 远程 MCP 地址；托管 Stdio 为空。 }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/MCPParameterDefinition' }
        status: { type: string, enum: [active, disabled] }
        sourceType: { type: string, enum: [remote, github, gitee, upload] }
        runtimeType: { type: string, enum: [node, python] }
        entryFile: { type: string }
        deploymentStatus: { type: string, enum: [building, failed, stopped, running] }
        deploymentError: { type: string }
        currentRevision: { type: string }
        credentialsConfigured: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MCPGitHubImportInput:
      type: object
      required: [name, repository, commit, runtimeType]
      properties:
        name: { type: string, maxLength: 120 }
        repository: { type: string, description: 公开 GitHub owner/repo，不接受自定义下载 URL。 }
        commit: { type: string, pattern: '^[a-fA-F0-9]{40}$', description: 完整固定提交 SHA。 }
        runtimeType: { type: string, enum: [node, python] }
        entryFile: { type: string, description: Node.js 可省略，系统从根目录 package.json 的 start 或 main 自动识别，并在编译后验证；Python 必填 .py 相对路径。 }
    MCPRepositoryImportInput:
      type: object
      required: [repositoryUrl, runtimeType]
      properties:
        name: { type: string, maxLength: 120, description: 首次导入时必填；新增版本时忽略。 }
        repositoryUrl: { type: string, description: 仅允许完整的公开 GitHub 或 Gitee 仓库 HTTPS 地址，可带 .git 后缀。 }
        ref: { type: string, description: 分支、标签或完整提交号；省略时使用仓库默认分支。服务端解析并固定到 SHA。 }
        runtimeType: { type: string, enum: [node, python] }
        entryFile: { type: string, description: Node.js 可省略，系统自动识别运行入口；Python 必填。 }
    MCPUploadImportInput:
      type: object
      required: [name, runtimeType, archive]
      properties:
        name: { type: string, maxLength: 120 }
        runtimeType: { type: string, enum: [node, python] }
        entryFile: { type: string, description: Node.js 可省略，Python 必填。 }
        archive: { type: string, format: binary, description: 最大 20 MiB 的 .tar.gz，根目录需有 README.md 作为服务描述。 }
    MCPDeploymentVersion:
      type: object
      required: [id, serviceId, sourceType, sourceRef, revision, runtimeType, entryFile, buildStatus, buildLog, errorMessage, createdAt]
      properties:
        id: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        sourceType: { type: string, enum: [github, gitee, upload] }
        sourceRef: { type: string, description: 完整仓库地址或上传包文件名。 }
        revision: { type: string, description: 解析后的固定提交 SHA 或上传包 SHA-256。 }
        runtimeType: { type: string, enum: [node, python] }
        entryFile: { type: string }
        buildStatus: { type: string, enum: [building, succeeded, failed] }
        buildLog: { type: string, description: 最后 64 KiB 构建日志，仅管理员可查看。 }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    MCPDeploymentResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [service, version]
          properties:
            service: { $ref: '#/components/schemas/MCPService' }
            version: { $ref: '#/components/schemas/MCPDeploymentVersion' }
    MCPDeploymentVersionListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MCPDeploymentVersion' }
    MCPDeploymentCapabilityEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [enabled, sourceTypes, runtimes]
          properties:
            enabled: { type: boolean }
            sourceTypes: { type: array, items: { type: string } }
            runtimes: { type: array, items: { type: string } }
    MCPRuntimeStatusEnvelope:
      type: object
