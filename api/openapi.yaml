openapi: 3.1.0
info:
  title: Harness Admin API
  version: 0.15.0
  description: Harness 企业控制面 HTTP API。
servers:
  - url: /api/v1
paths:
  /platform/auth/login:
    post:
      summary: 平台管理员登录
      operationId: platformLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformLoginRequest' }
      responses:
        '200':
          description: 平台管理员登录成功，写入独立平台会话与 CSRF Cookie。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformLoginEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: 登录失败次数过多。 }
  /platform/auth/me:
    get:
      summary: 获取当前平台管理员
      operationId: getCurrentPlatformAdmin
      security:
        - platformSessionCookie: []
      responses:
        '200':
          description: 当前平台管理员。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdminEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /platform/auth/logout:
    post:
      summary: 退出平台管理
      operationId: platformLogout
      security:
        - platformSessionCookie: []
          csrfHeader: []
      responses:
        '200': { description: 平台会话已吊销。 }
  /platform/organizations:
    get:
      summary: 查询全部企业
      operationId: listPlatformOrganizations
      security:
        - platformSessionCookie: []
      responses:
        '200':
          description: 企业列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOrganizationListEnvelope' }
    post:
      summary: 创建企业及首位企业管理员
      operationId: createPlatformOrganization
      security:
        - platformSessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlatformOrganizationRequest' }
      responses:
        '201':
          description: 企业、企业管理员角色和首位管理员已在同一事务中创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOrganizationEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 企业编码已存在。 }
  /platform/organizations/{organizationId}/status:
    put:
      summary: 修改企业状态
      operationId: updatePlatformOrganizationStatus
      security:
        - platformSessionCookie: []
          csrfHeader: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlatformOrganizationStatusRequest' }
      responses:
        '200':
          description: 企业状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOrganizationEnvelope' }
        '404': { description: 企业不存在。 }
  /auth/organizations:
    get:
      summary: 查询可登录企业
      description: 登录页公开读取启用中的企业名称与企业编码。
      operationId: listLoginOrganizations
      responses:
        '200':
          description: 可登录企业列表，按创建时间排序。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOrganizationListEnvelope'
  /auth/login:
    post:
      summary: 登录管理端
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，同时写入会话与 CSRF Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: 账号因连续登录失败已被锁定，需要管理员解锁。
        '429':
          description: 登录失败次数过多。
  /auth/me:
    get:
      summary: 获取当前登录用户
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: 退出登录
      operationId: logout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 会话已吊销。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/password:
    put:
      summary: 修改当前账号密码
      description: 修改成功后保留当前会话，并吊销当前账号的其他会话。
      operationId: changeCurrentPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码已修改。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeEnvelope'
        '400':
          description: 密码参数不正确或当前密码错误。
        '409':
          description: 新密码与当前密码相同。
  /auth/profile:
    put:
      summary: 修改当前账号资料
      description: 修改当前登录用户的显示名称和邮箱，登录用户名不可修改。
      operationId: updateCurrentUserProfile
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 个人资料已更新。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 邮箱已被当前企业内其他用户使用。
  /auth/sessions:
    get:
      summary: 查询当前账号的活跃会话
      operationId: listCurrentUserSessions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 未过期且未吊销的会话，当前会话优先返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionListEnvelope'
  /auth/sessions/{sessionId}:
    delete:
      summary: 吊销指定会话
      description: 只能吊销当前账号名下的非当前会话。
      operationId: revokeCurrentUserSession
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 会话已吊销。
        '404':
          description: 会话不存在或已经失效。
        '409':
          description: 不能通过会话管理吊销当前会话。
  /auth/sessions/revoke-others:
    post:
      summary: 吊销当前账号的其他会话
      operationId: revokeOtherCurrentUserSessions
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 其他会话已吊销，当前会话保持登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevocationEnvelope'
  /users:
    get:
      summary: 查询当前企业用户
      operationId: listUsers
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, locked, disabled]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页用户列表，需要 `iam.user.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 创建用户
      operationId: createUser
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 用户创建成功，需要 `iam.user.write` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 用户名或邮箱已存在。
  /users/{userId}:
    put:
      summary: 修改用户资料
      description: 修改显示名称和邮箱；登录用户名创建后不可修改。需要 `iam.user.write` 权限。
      operationId: updateUser
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 用户资料修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户不存在。
        '409':
          description: 邮箱已被当前企业内其他用户使用。
  /users/{userId}/status:
    patch:
      summary: 修改用户状态
      operationId: changeUserStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: 状态修改成功；停用时会吊销该用户全部会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '404':
          description: 用户不存在。
        '409':
          description: 不能停用当前登录账号；锁定用户必须使用解锁接口。
  /users/{userId}/password:
    put:
      summary: 重置用户密码
      description: 重置成功后吊销目标用户的全部会话；不能通过该接口重置当前登录账号。
      operationId: resetUserPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 密码已重置，需要 `iam.user.write` 权限。
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户不存在。
        '409':
          description: 不能重置当前登录账号的密码。
  /users/{userId}/unlock:
    post:
      summary: 解锁用户
      description: 清除目标账号的登录失败计数并恢复为正常状态，需要 `iam.user.write` 权限。
      operationId: unlockUser
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 用户已解锁，可以重新登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '404':
          description: 用户不存在。
        '409':
          description: 用户当前未被锁定。
  /users/{userId}/roles:
    put:
      summary: 设置用户角色
      operationId: assignUserRoles
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: 用户角色已更新，需要 `iam.user.write` 权限。
        '404':
          description: 用户或角色不存在。
        '409':
          description: 不能修改当前登录账号的角色。
  /users/{userId}/department:
    patch:
      summary: 调整用户所属部门
      operationId: assignUserDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId]
              properties:
                departmentId:
                  type: string
                  description: 部门 UUID；空字符串表示清除部门归属。
      responses:
        '200':
          description: 用户部门已更新，需要 `iam.user.write` 权限。
        '404':
          description: 用户不存在。
  /organization:
    get:
      summary: 获取当前企业资料
      operationId: getOrganization
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前登录用户所属企业，需要 `iam.organization.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: 修改当前企业资料
      description: 仅修改企业展示名称；企业编码作为登录和数据隔离标识不可修改。需要 `iam.organization.write` 权限。
      operationId: updateOrganization
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: 企业资料修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 企业不存在。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /departments:
    get:
      summary: 查询当前企业部门
      operationId: listDepartments
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 部门平铺列表，通过 parentId 表达层级，需要 `iam.department.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentListEnvelope' }
    post:
      summary: 创建部门
      operationId: createDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartmentRequest' }
      responses:
        '201':
          description: 部门创建成功，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 部门代码已存在。
  /departments/{departmentId}:
    put:
      summary: 修改部门
      operationId: updateDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDepartmentRequest' }
      responses:
        '200':
          description: 部门已更新，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 不能移动到自身或下级部门。
  /departments/{departmentId}/status:
    patch:
      summary: 修改部门状态
      operationId: changeDepartmentStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 部门状态已更新，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 部门下仍有启用中的子部门或用户。
  /roles:
    get:
      summary: 查询当前企业角色
      operationId: listRoles
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 角色列表，需要 `iam.role.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListEnvelope'
    post:
      summary: 创建角色
      operationId: createRole
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: 角色创建成功，需要 `iam.role.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '409':
          description: 角色代码已存在。
  /roles/{roleId}:
    put:
      summary: 修改自定义角色
      operationId: updateRole
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: 角色已更新，需要 `iam.role.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '409':
          description: 系统内置角色不允许修改。
  /permissions:
    get:
      summary: 查询系统权限定义
      operationId: listPermissions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 权限列表，需要 `iam.role.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionListEnvelope' }
  /audit-events:
    get:
      summary: 查询当前企业审计事件
      operationId: listAuditEvents
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: 模糊匹配动作、资源、请求 ID 或操作人。
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, denied, failed] }
        - name: startedAt
          in: query
          schema: { type: string, format: date-time }
        - name: endedAt
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页审计事件列表，需要 `audit.event.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventListEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-events/{eventId}:
    get:
      summary: 查询审计事件详情
      operationId: getAuditEvent
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: 当前企业内的审计事件详情，需要 `audit.event.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventEnvelope' }
        '404':
          description: 审计事件不存在或不属于当前企业。
  /oidc/clients:
    get:
      summary: 查询当前企业的统一登录应用
      operationId: listOIDCClients
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 应用列表，不返回完整客户端密钥，需要 `oidc.client.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建统一登录应用
      description: 客户端密钥只在创建成功的响应中返回一次，服务端仅保存 SHA-256 哈希。
      operationId: createOIDCClient
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCClientWriteRequest' }
      responses:
        '201':
          description: 应用已创建，响应包含仅展示一次的客户端密钥。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOIDCClientEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /oidc/clients/{oidcClientId}:
    put:
      summary: 修改统一登录应用
      operationId: updateOIDCClient
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          description: 应用记录标识，不是对外的 client_id。
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCClientWriteRequest' }
      responses:
        '200':
          description: 应用设置已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
  /oidc/clients/{oidcClientId}/status:
    patch:
      summary: 修改统一登录应用状态
      operationId: changeOIDCClientStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 应用状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientEnvelope' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
  /oidc/clients/{oidcClientId}/rotate-secret:
    post:
      summary: 轮换统一登录应用的客户端密钥
      operationId: rotateOIDCClientSecret
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 密钥已轮换，旧密钥立即失效，响应包含仅展示一次的新密钥。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOIDCClientEnvelope' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
  /.well-known/openid-configuration:
    servers:
      - url: /
    get:
      summary: 获取 OpenID Connect 发现文档
      operationId: getOIDCDiscovery
      responses:
        '200':
          description: OIDC Provider 元数据。
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /oauth2/jwks:
    get:
      summary: 获取 OIDC RSA 公钥集
      operationId: getOIDCJWKS
      responses:
        '200':
          description: 用于校验 RS256 身份令牌和访问令牌的 JSON Web Key Set。
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /oauth2/authorize:
    get:
      summary: 发起 OIDC 授权码登录
      description: 要求当前 Harness Admin 用户会话有效，并强制使用 PKCE S256。未登录时跳转到管理端登录页。
      operationId: authorizeOIDC
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string, maxLength: 255 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      responses:
        '302': { description: 跳转到登录页或客户端登记的精确回调地址。 }
        '400':
          description: 授权请求不正确。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /oauth2/token:
    post:
      summary: 兑换或刷新 OIDC 令牌
      operationId: exchangeOIDCToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OIDCTokenRequest'
      responses:
        '200':
          description: 令牌签发成功；刷新令牌仅在授权包含 offline_access 时返回。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCTokenResponse' }
        '400':
          description: 授权码、PKCE 或刷新令牌无效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: 客户端认证失败。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /oauth2/userinfo:
    get:
      summary: 获取 OIDC 当前用户资料
      operationId: getOIDCUserInfo
      security:
        - oidcBearer: []
      responses:
        '200':
          description: 返回内容按令牌 scope 过滤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCUserInfo' }
        '401':
          description: Bearer 访问令牌无效或已过期。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /model-providers:
    get:
      summary: 查询当前企业的模型供应商连接
      operationId: listModelProviders
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 供应商连接列表，需要 `model.provider.read` 权限；响应不包含访问凭据。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建模型供应商连接
      operationId: createModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelProviderRequest' }
      responses:
        '201':
          description: 供应商连接已创建，API Key 已加密保存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 企业内供应商连接编码已存在。 }
  /model-providers/{providerId}:
    put:
      summary: 修改模型供应商连接
      description: "apiKey 省略时保留当前凭据；提供时替换加密凭据。"
      operationId: updateModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelProviderRequest' }
      responses:
        '200':
          description: 供应商连接已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
        '404': { description: 供应商连接不存在。 }
  /model-providers/{providerId}/status:
    patch:
      summary: 修改模型供应商连接状态
      operationId: changeModelProviderStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 供应商连接状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
  /model-providers/{providerId}/probe:
    post:
      summary: 检测模型供应商连接
      description: 使用加密保存的凭据读取上游模型列表，不发送业务数据。
      operationId: probeModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 连接检测成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderProbeEnvelope' }
        '409': { description: 供应商连接已停用。 }
        '502': { description: 无法连接供应商，或供应商拒绝凭据。 }
  /models:
    get:
      summary: 查询当前企业的模型目录
      operationId: listModels
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 模型目录列表，需要 `model.catalog.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogListEnvelope' }
    post:
      summary: 创建模型目录项
      operationId: createModel
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelRequest' }
      responses:
        '201':
          description: 模型目录项已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
        '409': { description: 模型编码或供应商侧模型标识已存在。 }
  /models/{modelId}:
    put:
      summary: 修改模型目录项
      operationId: updateModel
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelRequest' }
      responses:
        '200':
          description: 模型目录项已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
        '404': { description: 模型或供应商连接不存在。 }
  /models/{modelId}/status:
    patch:
      summary: 修改模型状态
      operationId: changeModelStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 模型状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
  /model-gateway/api-keys:
    get:
      summary: 查询当前企业的模型网关调用密钥
      operationId: listModelGatewayAPIKeys
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 调用密钥列表，仅返回非敏感前缀，需要 `model.gateway.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建模型网关调用密钥
      description: 完整密钥只在创建成功的响应中返回一次，服务端仅保存 SHA-256 哈希。
      operationId: createModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGatewayAPIKeyRequest' }
      responses:
        '201':
          description: 调用密钥已创建，响应包含仅展示一次的完整密钥。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedGatewayAPIKeyEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /model-gateway/api-keys/{apiKeyId}/revoke:
    patch:
      summary: 吊销模型网关调用密钥
      operationId: revokeModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 调用密钥已吊销，立即停止接受新调用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyEnvelope' }
        '404': { description: 调用密钥不存在或不属于当前企业。 }
  /model-gateway/api-keys/{apiKeyId}:
    put:
      summary: 修改模型网关调用密钥
      description: 修改名称、过期时间、限流、月度 Token 额度和可用模型范围，不更换密钥值。
      operationId: updateModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGatewayAPIKeyRequest' }
      responses:
        '200':
          description: 调用密钥设置已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 调用密钥不存在或不属于当前企业。 }
  /model-gateway/calls:
    get:
      summary: 查询当前企业的模型网关调用记录
      description: 不保存提示词与模型回答，支持按调用密钥、模型编码、结果和时间范围查询。
      operationId: listModelGatewayCalls
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: apiKeyId
          in: query
          schema: { type: string, format: uuid }
        - name: modelCode
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, failed] }
        - name: startedAt
          in: query
          schema: { type: string, format: date-time }
        - name: endedAt
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 网关调用记录，需要 `model.gateway.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayCallPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/chat/completions:
    servers:
      - url: /
    post:
      summary: OpenAI 兼容聊天补全入口
      description: 使用企业模型编码选择已启用的模型，支持流式与非流式响应透传。可使用网关调用密钥，或包含 `model.invoke` scope 的 OIDC 用户访问令牌。
      operationId: gatewayChatCompletions
      security:
        - gatewayBearer: []
        - oidcBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string, description: 企业模型目录中的模型编码。 }
                messages:
                  type: array
                  items: { type: object, additionalProperties: true }
                stream: { type: boolean, default: false }
              additionalProperties: true
      responses:
        '200':
          description: 上游 OpenAI 兼容响应，流式调用返回 `text/event-stream`。
        '400': { description: 请求格式不正确。 }
        '401': { description: 调用密钥无效、已吊销或已过期。 }
        '403': { description: 调用密钥无权访问请求的模型。 }
        '404': { description: 模型编码不存在。 }
        '409': { description: 模型或供应商连接已停用。 }
        '429': { description: 超过每分钟请求限制，或当月 Token 额度已用尽。 }
        '502': { description: 无法连接模型供应商。 }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: harness_admin_session
    platformSessionCookie:
      type: apiKey
      in: cookie
      name: harness_platform_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    gatewayBearer:
      type: http
      scheme: bearer
      bearerFormat: Harness gateway key
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 请求参数不正确。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或会话已失效。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 权限不足或 CSRF 校验失败。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    PlatformLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 80 }
        password: { type: string, format: password, maxLength: 1024 }
    PlatformAdmin:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
    PlatformOrganization:
      type: object
      required: [id, code, name, status, adminUsername, userCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        adminUsername: { type: string }
        userCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePlatformOrganizationRequest:
      type: object
      required: [code, name, adminUsername, adminDisplayName, adminPassword]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        adminUsername: { type: string, minLength: 1, maxLength: 80 }
        adminDisplayName: { type: string, minLength: 1, maxLength: 120 }
        adminEmail: { type: string, description: 可为空字符串。 }
        adminPassword: { type: string, format: password, minLength: 3, maxLength: 1024 }
    UpdatePlatformOrganizationStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    LoginRequest:
      type: object
      required: [organizationCode, username, password]
      properties:
        organizationCode: { type: string }
        username: { type: string }
        password: { type: string, format: password }
    LoginOrganization:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    CreateUserRequest:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 80 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        departmentId: { type: string, format: uuid }
        password: { type: string, format: password, minLength: 3 }
    UpdateUserRequest:
      type: object
      required: [displayName, email]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email:
          type: string
          description: 电子邮箱；空字符串表示清除邮箱。
    UpdateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 3, maxLength: 1024 }
    UpdateProfileRequest:
      type: object
      required: [displayName, email]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email:
          type: string
          description: 电子邮箱；空字符串表示清除邮箱。
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 3, maxLength: 1024 }
    CreateRoleRequest:
      type: object
      required: [code, name, permissionCodes]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        permissionCodes:
          type: array
          items: { type: string }
    UpdateRoleRequest:
      type: object
      required: [name, permissionCodes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        permissionCodes:
          type: array
          items: { type: string }
    CreateDepartmentRequest:
      type: object
      required: [code, name, sortOrder]
      properties:
        parentId: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
    UpdateDepartmentRequest:
      type: object
      required: [name, sortOrder]
      properties:
        parentId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
    CreateModelProviderRequest:
      type: object
      required: [code, name, baseUrl, apiKey]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        providerKind:
          type: string
          enum: [openai_compatible, deepseek, aliyun_bailian, kimi, ollama]
          default: openai_compatible
          description: 供应商协议预设；当前均通过 OpenAI 兼容接口接入。
        baseUrl: { type: string, format: uri }
        apiKey: { type: string, format: password, minLength: 1, maxLength: 4096, writeOnly: true }
        requestTimeoutMs: { type: integer, minimum: 1000, maximum: 120000, default: 15000 }
    UpdateModelProviderRequest:
      type: object
      required: [name, providerKind, baseUrl, requestTimeoutMs]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        providerKind:
          type: string
          enum: [openai_compatible, deepseek, aliyun_bailian, kimi, ollama]
          description: 供应商协议预设；当前均通过 OpenAI 兼容接口接入。
        baseUrl: { type: string, format: uri }
        apiKey:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: 省略时保留当前凭据。
        requestTimeoutMs: { type: integer, minimum: 1000, maximum: 120000 }
    StatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    OIDCClientWriteRequest:
      type: object
      required: [name, redirectUris, allowedScopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        redirectUris:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: 精确匹配的登录回调地址；生产环境必须使用 HTTPS，回环地址可使用 HTTP。
          items: { type: string, format: uri, maxLength: 2048 }
        allowedScopes:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: 必须包含 openid。
          items: { type: string, enum: [openid, profile, email, model.invoke, offline_access] }
    OIDCClient:
      type: object
      required: [id, name, clientId, clientSecretPrefix, redirectUris, allowedScopes, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clientId: { type: string, description: 对外公开的 OAuth 客户端标识。 }
        clientSecretPrefix: { type: string, description: 可安全展示的客户端密钥前缀。 }
        redirectUris:
          type: array
          items: { type: string, format: uri }
        allowedScopes:
          type: array
          items: { type: string, enum: [openid, profile, email, model.invoke, offline_access] }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatedOIDCClient:
      allOf:
        - $ref: '#/components/schemas/OIDCClient'
        - type: object
          required: [clientSecret]
          properties:
            clientSecret: { type: string, readOnly: true, description: 仅在创建或轮换成功时返回一次的完整客户端密钥。 }
    OIDCTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string, description: 也可通过 HTTP Basic 用户名传递。 }
        client_secret: { type: string, format: password, description: 也可通过 HTTP Basic 密码传递。 }
        code: { type: string }
        redirect_uri: { type: string, format: uri }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        refresh_token: { type: string }
    OIDCTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, id_token, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, example: 3600 }
        id_token: { type: string }
        refresh_token: { type: string }
        scope: { type: string }
    OIDCUserInfo:
      type: object
      required: [sub, org_id, org_code]
      properties:
        sub: { type: string, format: uuid }
        name: { type: string }
        preferred_username: { type: string }
        email: { type: string, format: email }
        org_id: { type: string, format: uuid }
        org_code: { type: string }
    OAuthError:
      type: object
      required: [error, error_description]
      properties:
        error: { type: string }
        error_description: { type: string }
    CreateModelRequest:
      type: object
      required: [providerConnectionId, code, upstreamModelId, capabilities]
      properties:
        providerConnectionId: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' }
        upstreamModelId: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 120, description: 省略或留空时使用上游模型标识。 }
        modelType: { type: string, enum: [chat], default: chat }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, vision, tools, streaming, json] }
        contextWindowTokens: { type: integer, minimum: 0, default: 0 }
        maxOutputTokens: { type: integer, minimum: 0, default: 0 }
    UpdateModelRequest:
      description: 模型编码创建后不可修改。
      type: object
      required: [providerConnectionId, upstreamModelId, capabilities]
      properties:
        providerConnectionId: { type: string, format: uuid }
        upstreamModelId: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 120, description: 省略或留空时使用上游模型标识。 }
        modelType: { type: string, enum: [chat], default: chat }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, vision, tools, streaming, json] }
        contextWindowTokens: { type: integer, minimum: 0, default: 0 }
        maxOutputTokens: { type: integer, minimum: 0, default: 0 }
    ModelProvider:
      type: object
      required: [id, code, name, providerKind, baseUrl, status, requestTimeoutMs, credentialConfigured, lastProbeStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        providerKind: { type: string, enum: [openai_compatible, deepseek, aliyun_bailian, kimi, ollama] }
        baseUrl: { type: string, format: uri }
        status: { type: string, enum: [active, disabled] }
        requestTimeoutMs: { type: integer }
        credentialConfigured: { type: boolean }
        lastProbeStatus: { type: string, enum: [unknown, success, failed] }
        lastProbeAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModelCatalogEntry:
      type: object
      required: [id, providerConnectionId, providerName, code, upstreamModelId, name, modelType, capabilities, contextWindowTokens, maxOutputTokens, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        providerConnectionId: { type: string, format: uuid }
        providerName: { type: string }
        code: { type: string }
        upstreamModelId: { type: string }
        name: { type: string }
        modelType: { type: string, enum: [chat] }
        capabilities:
          type: array
          items: { type: string, enum: [text, vision, tools, streaming, json] }
        contextWindowTokens: { type: integer }
        maxOutputTokens: { type: integer }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateGatewayAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        expiresAt: { type: string, format: date-time, description: 省略时永不过期，必须晚于当前时间。 }
        requestsPerMinute: { type: integer, minimum: 0, maximum: 100000, default: 60, description: 0 表示不限制。 }
        monthlyTokenLimit: { type: integer, format: int64, minimum: 0, default: 0, description: UTC 自然月 Token 额度，0 表示不限制。 }
        allowedModelCodes:
          type: array
          description: 允许调用的模型编码；空数组表示所有已启用模型。
          items: { type: string }
    UpdateGatewayAPIKeyRequest:
      allOf:
        - $ref: '#/components/schemas/CreateGatewayAPIKeyRequest'
        - type: object
          required: [name, requestsPerMinute, monthlyTokenLimit, allowedModelCodes]
    GatewayAPIKey:
      type: object
      required: [id, name, keyPrefix, status, requestsPerMinute, monthlyTokenLimit, monthlyTokenUsed, allowedModelCodes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        keyPrefix: { type: string, description: 可安全展示的密钥前缀。 }
        status: { type: string, enum: [active, revoked] }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        requestsPerMinute: { type: integer, minimum: 0 }
        monthlyTokenLimit: { type: integer, format: int64, minimum: 0 }
        monthlyTokenUsed: { type: integer, format: int64, minimum: 0 }
        allowedModelCodes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    CreatedGatewayAPIKey:
      allOf:
        - $ref: '#/components/schemas/GatewayAPIKey'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, writeOnly: true, description: 仅在创建成功时返回一次的完整调用密钥。 }
    GatewayCall:
      type: object
      required: [id, authType, requestId, modelCode, upstreamModelId, streaming, result, httpStatus, latencyMs, promptTokens, completionTokens, totalTokens, errorCode, sourceIp, createdAt]
      properties:
        id: { type: string, format: uuid }
        authType: { type: string, enum: [api_key, user] }
        apiKeyId: { type: string, format: uuid, description: authType 为 api_key 时返回。 }
        apiKeyName: { type: string, description: authType 为 api_key 时返回。 }
        userId: { type: string, format: uuid, description: authType 为 user 时返回。 }
        userName: { type: string, description: authType 为 user 时返回。 }
        requestId: { type: string }
        modelCode: { type: string }
        upstreamModelId: { type: string }
        streaming: { type: boolean }
        result: { type: string, enum: [success, failed] }
        httpStatus: { type: integer }
        latencyMs: { type: integer, format: int64 }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        totalTokens: { type: integer }
        errorCode: { type: string }
        sourceIp: { type: string }
        createdAt: { type: string, format: date-time }
    GatewayCallPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GatewayCall' }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    AuthUser:
      type: object
