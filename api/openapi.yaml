        serviceName: { type: string }
        code: { type: string }
        gatewayUrl: { type: string, format: uri }
        name: { type: string }
        purpose: { type: string, enum: [harness, developer] }
        authMode: { type: string, enum: [oidc, bearer, none] }
        applicationName: { type: string }
        status: { type: string, enum: [active, disabled] }
        expiresAt: { type: string, format: date-time }
        keyPrefix: { type: string }
        upstreamAuthConfigured: { type: boolean }
        upstreamHeaderConfigured: { type: boolean }
        upstreamQueryConfigured: { type: boolean }
