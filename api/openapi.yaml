          required: [subjectIds, monthlyTokenMode]
          properties:
            subjectIds:
              type: array
              minItems: 1
              maxItems: 10000
              uniqueItems: true
              items: { type: string, format: uuid }
    ModelPolicy:
      type: object
      required: [subjectType, subjectId, subjectName, scopeMode, requestsPerMinute, monthlyTokenLimit, monthlyTokenMode, monthlyTokenUsed, createdAt, updatedAt]
      properties:
        subjectType: { type: string, enum: [department, user] }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        scopeMode: { type: string, enum: [inherit, all, selected, none] }
        allowedModelCodes:
          type: array
          nullable: true
          items: { type: string }
        requestsPerMinute: { type: integer }
        monthlyTokenLimit: { type: integer, format: int64 }
        monthlyTokenMode: { type: string, enum: [shared, per_user] }
        monthlyTokenUsed: { type: integer, format: int64, description: '该部门或用户本月已用 Token 合计；部门 per_user 模式下不是单个用户的用量。' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data:
          type: array
          items:
            type: object
            required: [id, object, created, owned_by, model_type]
            properties:
              id: { type: string, description: 企业模型编码。 }
              object: { type: string, enum: [model] }
              created: { type: integer, format: int64, description: Unix 秒时间戳。 }
              owned_by: { type: string, enum: [harness-admin] }
              model_type: { type: string, enum: [chat, image, video], description: 当前可调用模型对应的网关入口类型。 }
              name: { type: string, description: Harness Admin 中配置的模型显示名称。 }
              capabilities:
                type: array
                description: Harness Admin 中配置的模型能力代码。
                items: { type: string }
    CreateGatewayAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        expiresAt: { type: string, format: date-time, description: 省略时永不过期，必须晚于当前时间。 }
        requestsPerMinute: { type: integer, minimum: 0, maximum: 100000, default: 60, description: 0 表示不限制。 }
        monthlyTokenLimit: { type: integer, format: int64, minimum: 0, default: 0, description: UTC 自然月 Token 额度，0 表示不限制。 }
        allowedModelCodes:
          type: array
          description: 允许调用的模型编码；空数组表示所有已启用模型。
          items: { type: string }
    UpdateGatewayAPIKeyRequest:
      allOf:
        - $ref: '#/components/schemas/CreateGatewayAPIKeyRequest'
        - type: object
          required: [name, requestsPerMinute, monthlyTokenLimit, allowedModelCodes]
    GatewayAPIKey:
      type: object
      required: [id, name, keyPrefix, status, requestsPerMinute, monthlyTokenLimit, monthlyTokenUsed, allowedModelCodes, allowedModels, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        keyPrefix: { type: string, description: 可安全展示的密钥前缀。 }
        status: { type: string, enum: [active, revoked] }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        requestsPerMinute: { type: integer, minimum: 0 }
        monthlyTokenLimit: { type: integer, format: int64, minimum: 0 }
        monthlyTokenUsed: { type: integer, format: int64, minimum: 0 }
        allowedModelCodes:
          type: array
          items: { type: string }
        allowedModels:
          type: array
          description: 按允许的模型编码顺序返回当前供应商和模型显示名称；编码继续用于路由和权限判断。
          items:
            type: object
            required: [code, providerName, modelName]
            properties:
              code: { type: string, description: 不可修改的模型编码。 }
              providerName: { type: string, description: 当前供应商连接名称；连接已删除时为空。 }
              modelName: { type: string, description: 当前模型名称；模型已删除时为空。 }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    CreatedGatewayAPIKey:
      allOf:
        - $ref: '#/components/schemas/GatewayAPIKey'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, readOnly: true, description: 创建成功时返回的完整调用密钥；后续可通过密钥查看接口再次读取。 }
    GatewayCallTiming:
      type: object
      description: 观测到的供应商调用里程碑，不包含思考正文；缺少的里程碑表示未观测到
      required: [stage, reasoningPolicy, requestedAt, finishedAt]
      properties:
        stage: { type: string }
        reasoningPolicy: { type: string }
        requestedAt: { type: string, format: date-time }
        headersAt: { type: string, format: date-time }
        firstReasoningAt: { type: string, format: date-time }
        firstContentAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        reasoningTokens: { type: integer }
    GatewayCall:
      type: object
      required: [id, authType, requestId, modelCode, modelName, modelType, upstreamModelId, providerName, streaming, result, httpStatus, latencyMs, promptTokens, completionTokens, totalTokens, usageReported, quotaExceeded, errorCode, sourceIp, createdAt]
      properties:
        timing: { $ref: '#/components/schemas/GatewayCallTiming' }
        id: { type: string, format: uuid }
        authType: { type: string, enum: [api_key, user] }
        apiKeyId: { type: string, format: uuid, description: authType 为 api_key 时返回。 }
        apiKeyName: { type: string, description: authType 为 api_key 时返回。 }
        userId: { type: string, format: uuid, description: authType 为 user 时返回。 }
        userName: { type: string, description: authType 为 user 时返回。 }
        departmentId: { type: string, format: uuid, description: 调用发生时的部门标识；历史数据可能没有。 }
        requestId: { type: string }
        modelCode: { type: string }
        modelName: { type: string, description: 当前模型目录名称；修改名称后，历史调用记录会显示新名称。 }
        modelType: { type: string, enum: [chat, image, video] }
        upstreamModelId: { type: string }
        providerName: { type: string, description: 当前供应商连接名称；修改名称后，历史调用记录会显示新名称。 }
        streaming: { type: boolean }
        result: { type: string, enum: [success, failed] }
        httpStatus: { type: integer }
        latencyMs: { type: integer, format: int64 }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        totalTokens: { type: integer }
        usageReported: { type: boolean, description: 上游是否明确返回 Token 用量；false 时显示为未知。 }
        quotaExceeded: { type: boolean, description: 本次记账后是否超过调用身份的月度 Token 额度。 }
        errorCode: { type: string }
        sourceIp: { type: string }
        createdAt: { type: string, format: date-time }
    GatewayCallPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GatewayCall' }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    GatewayUsageGroup:
      type: object
      required: [id, name, callCount, knownTokens, unknownUsageCalls, overQuotaCalls]
      properties:
        id: { type: string, description: 部门或用户 UUID、模型编码；历史缺失部门时为空字符串。 }
        name: { type: string, description: 当前显示名称；按模型统计时为当前模型名称，目录项已删除时回退到模型编码。 }
        callCount: { type: integer, format: int64 }
        knownTokens: { type: integer, format: int64 }
        unknownUsageCalls: { type: integer, format: int64 }
        overQuotaCalls: { type: integer, format: int64 }
    GatewayUsagePage:
      type: object
      required: [month, groupBy, callCount, knownTokens, unknownUsageCalls, overQuotaCalls, items, total, page, pageSize]
      properties:
        month: { type: string, description: UTC 月份，YYYY-MM。 }
        groupBy: { type: string, enum: [department, user, model] }
        callCount: { type: integer, format: int64 }
        knownTokens: { type: integer, format: int64 }
        unknownUsageCalls: { type: integer, format: int64 }
        overQuotaCalls: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/GatewayUsageGroup' }
        total: { type: integer, format: int64 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    GatewayAlert:
      type: object
      required: [id, month, dedupeKey, kind, subjectType, subjectName, severity, usedTokens, tokenLimit, callCount, unknownUsageCalls, firstDetectedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        month: { type: string, description: UTC 月份，YYYY-MM。 }
        dedupeKey: { type: string, description: 企业内当月唯一的预警对象键。 }
        kind: { type: string, enum: [quota, unknown_usage] }
        subjectType: { type: string, enum: [department, user, department_user, api_key, model] }
        subjectName: { type: string }
        severity: { type: string, enum: [warning, critical] }
        usedTokens: { type: integer, format: int64 }
        tokenLimit: { type: integer, format: int64 }
        callCount: { type: integer, format: int64 }
        unknownUsageCalls: { type: integer, format: int64 }
        firstDetectedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    GatewayAlertSettings:
      type: object
      required: [autoRefreshEnabled]
      properties:
        autoRefreshEnabled: { type: boolean, description: 是否每分钟在后台生成当前 UTC 月预警。 }
        updatedAt: { type: string, format: date-time }
    GatewayAlertSettingsEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/GatewayAlertSettings' }
    GatewayAlertPage:
      type: object
      required: [month, activeCount, items, total, page, pageSize]
      properties:
        month: { type: string }
        activeCount: { type: integer, format: int64, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/GatewayAlert' }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    AuthUser:
