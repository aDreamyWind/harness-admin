openapi: 3.1.0
info:
  title: Harness Admin API
  version: 0.28.0
  description: Harness 企业控制面 HTTP API。
servers:
  - url: /api/v1
paths:
  /ai-drama/styles:
    get:
      summary: 查询可选择的漫剧视觉风格，仅返回公开展示字段
      operationId: listDramaVisualStyles
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 风格ID、名称、分类和封面。不返回生图、生视频模板或最终提示词。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DramaStyleOption' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ai-drama/projects/{id}/canvas:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: 读取项目自由画布与形象生成状态
      operationId: getDramaCanvas
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 操作成功。图片任务在后台执行，状态由画布接口轮询，失败保留已有图片。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaCanvas' }
        '400': { description: 参数无效或模型不可用。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: CSRF 校验失败。 }
        '404': { description: 项目或形象不存在，或不属于当前用户。 }
        '409': { description: 内容版本冲突、正在生成、未配置图片模型或来源图片尚未生成。 }
  /ai-drama/projects/{id}/canvas/layout:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: 保存画布位置及视口（使用版本防止覆盖）
      operationId: saveDramaCanvasLayout
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DramaCanvasLayout' }
      responses:
        '200':
          description: 操作成功。图片任务在后台执行，状态由画布接口轮询，失败保留已有图片。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaCanvasRevision' }
        '400': { description: 参数无效或模型不可用。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: CSRF 校验失败。 }
        '404': { description: 项目或形象不存在，或不属于当前用户。 }
        '409': { description: 内容版本冲突、正在生成、未配置图片模型或来源图片尚未生成。 }
  /ai-drama/projects/{id}/forms/{formId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: 编辑资产形象（生成中禁止编辑）
      operationId: editDramaAssetForm
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DramaFormEdit' }
      responses:
        '200':
          description: 操作成功。图片任务在后台执行，状态由画布接口轮询，失败保留已有图片。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaVisualSaved' }
        '400': { description: 参数无效或模型不可用。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: CSRF 校验失败。 }
        '404': { description: 项目或形象不存在，或不属于当前用户。 }
        '409': { description: 内容版本冲突、正在生成、未配置图片模型或来源图片尚未生成。 }
  /ai-drama/projects/{id}/forms/{formId}/derive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 创建同一资产的派生形象
      operationId: deriveDramaAssetForm
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        '201':
          description: 操作成功。图片任务在后台执行，状态由画布接口轮询，失败保留已有图片。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaDerivedForm' }
        '400': { description: 参数无效或模型不可用。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: CSRF 校验失败。 }
        '404': { description: 项目或形象不存在，或不属于当前用户。 }
        '409': { description: 内容版本冲突、正在生成、未配置图片模型或来源图片尚未生成。 }
  /ai-drama/projects/{id}/forms/{formId}/images:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 异步生成当前形象图片（使用当前用户图片模型设置）
      operationId: generateDramaAssetImage
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DramaImageInput' }
      responses:
        '202':
          description: 操作成功。图片任务在后台执行，状态由画布接口轮询，失败保留已有图片。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaImageJob' }
        '400': { description: 参数无效或模型不可用。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: CSRF 校验失败。 }
        '404': { description: 项目或形象不存在，或不属于当前用户。 }
        '409': { description: 内容版本冲突、正在生成、未配置图片模型或来源图片尚未生成。 }
  /ai-drama/projects/{id}/images/{imageId}/content:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: 读取当前用户项目中成功生成的历史图片
      operationId: getDramaImageContent
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 图片文件内容，不公开本地存储路径。使用 private no-store 缓存控制。
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 图片不存在、任务未成功或不属于当前用户。 }
  /ai-drama/models:
    get:
      summary: 查询当前用户可调用的已启用文本、图片和视频模型
      operationId: listDramaModels
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前用户可调用的文本、图片和视频模型。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DramaModel' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ai-drama/settings:
    get:
      summary: 查询当前用户的漫剧模型设置
      operationId: getDramaSettings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前用户设置；未设置时模型编码为空。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: 保存当前用户的漫剧默认模型
      operationId: saveDramaSettings
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DramaSettingsInput' }
      responses:
        '200':
          description: 已保存且可供新项目使用的设置。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ai-drama/projects:
    get:
      summary: 查询当前用户的漫剧项目及任务状态
      operationId: listDramaProjects
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 项目列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DramaProject' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: 保存原文或创意并开始后台概览解析
      operationId: createDramaProject
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DramaCreateInput' }
      responses:
        '201':
          description: 已保存项目及完整原文；后台读取前 10 万字生成概览，完整原文留待后续剧本解析。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaProject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ai-drama/projects/{id}:
    get:
      summary: 查询漫剧项目及概览解析结果
      operationId: getDramaProject
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 当前用户拥有的项目。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaProject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-drama/projects/{id}/retry:
    post:
      summary: 重新解析本人上传且概览解析失败的漫剧项目
      description: 复用数据库中保存的完整原文和当前用户的文本模型配置；若概览已完成则直接恢复为可继续状态。AI 生成剧本项目暂不支持重试。
      operationId: retryDramaProject
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: 项目已重新排队解析。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 项目状态不允许重试，或当前用户未配置可用文本模型。 }
  /ai-drama/projects/{id}/reanalyze-overview:
    post:
      summary: 使用当前用户配置的文本模型重新解析剧本概览
      description: 从已保存原文的前十万字符重新生成概览；解析成功前保留旧概览。只允许已有完整概览的本人项目调用。
      operationId: reanalyzeDramaOverview
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: 项目已排队重新解析。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 项目状态不允许重新解析，或当前用户未配置可用文本模型。 }
  /ai-drama/projects/{id}/source/range:
    get:
      summary: 按 Unicode 字符位置分页读取不可编辑的完整原文
      operationId: getDramaSourceRange
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: start, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 12000, default: 12000 } }
      responses:
        '200':
          description: 原文片段及全篇字符数；终点位置不包含在片段内。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaSourceRange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-drama/projects/{id}/batches:
    get:
      summary: 查询当前用户项目的剧本解析批次
      operationId: listDramaBatches
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 按批次编号升序排列。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DramaBatch' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: 根据起点方式创建待解析批次
      description: 服务端自动建议不超过十万字的终点；也可提交手动终点。创建时只保存原文区间；之后可在批次详情中启动 AI 解析。
      operationId: createDramaBatch
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DramaBatchSelection' }
      responses:
        '201':
          description: 已保存的批次。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 概览尚未完成。 }
  /ai-drama/projects/{id}/batches/suggest:
    get:
      summary: 按选定起点建议十万字内的最近完整边界
      operationId: suggestDramaBatch
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mode, in: query, required: true, schema: { type: string, enum: [beginning, previous, manual] } }
        - { name: previousBatchId, in: query, schema: { type: string, format: uuid } }
        - { name: startOffset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: 起止位置及边界来源，终点不超过起点后十万字符。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaBatchSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 概览尚未完成。 }
  /ai-drama/projects/{id}/video-episodes:
    get:
      summary: 查询由正式分集剧本关联的视频制作入口
      operationId: listDramaVideoEpisodes
      description: 解析落库后直接可见，无需先生成视频。仅返回具有批次和非空正文的正式剧集，按批次编号及批次内集号排序；不返回旧概览中的分集规划。当前分镜功能尚未接入，状态为待拆分。
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 本项目视频分集；没有正式剧本时返回空数组。
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/DramaVideoEpisode' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-drama/projects/{id}/video-episodes/{episodeId}:
    get:
      summary: 查询单集视频制作工作区及本集关联资产
      operationId: getDramaVideoEpisodeWorkspace
      description: episodeId 为原分集剧本主键。正文和资产描述从真实剧本与目录读取，仅返回本集实际关联的角色、场景、道具；状态说明单独返回。不复制剧本，不调用 AI，也不修改任何制作数据。
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 单集制作工作区。
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/DramaVideoEpisodeWorkspace' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-drama/projects/{id}/video-episodes/{episodeId}/storyboards:
    get:
      summary: 读取单集分镜、进度、资产形象与历史版本
      operationId: getDramaStoryboards
      description: 默认读取最新尝试，失败保留已通过片段；run指定历史版本。只有本项目所有者可读。运行期间客户端每两秒读取真实进度。
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: run, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaStoryboardPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 分镜运行中、并发版本冲突或来源已变化
    post:
      summary: 新建分镜拆分或从失败片段继续
      operationId: startDramaStoryboard
      description: resume为false时创建独立新版本；true时必须来源未变化且最新运行失败或部分完成，复用已通过片段与原模型，保留待修正草稿。旧运行尚有修正预算时沿用同一运行；预算耗尽时创建独立续跑版本，复制规划、全部片段及采用图片，从首个未完成片段继续，旧预算和派工记录保留在历史版本。检查失败先报告中心，由中心选择合法责任节点，修正后返回原检查点。跨前段修正会重查后续依赖。只生成文字分镜，不生成媒体。
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resume: { type: boolean, default: false }
      responses:
        '202':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaStoryboardRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 分镜运行中、并发版本冲突或来源已变化
  /ai-drama/projects/{id}/video-episodes/{episodeId}/storyboards/{runId}:
    put:
      summary: 将直接编辑或结构编辑的完整分镜保存为新历史版本
      description: 正文、时长和真实文字引用一起保存。文字引用支持本项目全剧形象，不修改正式小剧本中的资产关联。旧采用图片和历史版本保持原样；越界、重叠、其他项目形象或并发版本冲突均拒绝。
      operationId: editDramaStoryboard
      description: 只允许编辑最新非运行版本，使用revision检查并发。资产必须来自本集真实形象；已采用图片绑定由服务端保留，客户端不能伪造。人工台词修改不会修改来源剧本。
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, segments]
              properties:
                revision: { type: integer, minimum: 1 }
                segments: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/DramaStoryboardSegment' } }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaStoryboardRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 分镜运行中、并发版本冲突或来源已变化
  /ai-drama/projects/{id}/video-episodes/{episodeId}/storyboards/{runId}/optimize-pacing:
    post:
      summary: 创建新版本并优化当前片段的节奏
      operationId: optimizeDramaStoryboardPacing
      description: 仅限来源有效的最新非运行版本中的已完成片段；创建独立版本，只把所选片段设为待优化，其他镜头及采用图片保持原样。节奏建议通过局部修改及完整内容复核后才采纳；两轮未通过保留原稿并记录原因。不会自动生成媒体。
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, segmentId]
              properties:
                revision: { type: integer, minimum: 1 }
                segmentId: { type: string, format: uuid }
      responses:
        '202':
          description: 所选片段已入队，返回新版本
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DramaStoryboardRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 运行中、非最新版本、修订号冲突或来源已变化
  /ai-drama/projects/{id}/video-episodes/{episodeId}/storyboards/{runId}/segments/{segmentId}/videos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: segmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: 查询当前分镜片段的视频生成记录
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 最近的视频任务，按创建时间倒序
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DramaSegmentVideo' }
        '401': { description: 未登录 }
        '404': { description: 片段不存在或不属于当前用户 }
    post:
      summary: 使用当前已保存的分镜版本异步生成片段视频
      security:
        - sessionCookie: []
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
      responses:
        '202':
          description: 视频任务已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DramaSegmentVideo' }
        '400': { description: 参数错误、缺少参考图或超出模型限制 }
        '401': { description: 未登录 }
        '403': { description: 请求校验失败 }
        '404': { description: 项目或片段不存在 }
        '409': { description: 版本不可生成、未配置模型或已有任务在运行 }
  /ai-drama/projects/{id}/video-episodes/{episodeId}/storyboards/{runId}/segments/{segmentId}/videos/{videoId}/content:
    get:
      summary: 播放已生成的片段视频，支持字节范围请求
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: segmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: videoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: MP4 视频
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '206': { description: 请求的视频字节范围 }
        '401': { description: 未登录 }
        '404': { description: 视频不可读取或不属于当前用户 }
  /ai-drama/projects/{id}/video-episodes/{episodeId}/storyboards/{runId}/confirm:
    post:
      summary: 确认最新分镜版本
      operationId: confirmDramaStoryboard
      description: 只确认来源未变化的ready版本；后续媒体制作还需模型能力和素材检查，不自动触发付费生成。
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 分镜已确认
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      confirmed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 当前运行、来源或版本不允许确认 }
  /ai-drama/projects/{id}/batches/{batchId}/name:
    patch:
      summary: 修改批次名称并保护手动名称
      operationId: renameDramaBatch
      description: 名称与批次编号、原文范围独立。手动修改后，后续 AI 命名不会覆盖；资产来源和应用标签按批次ID读取最新名称。
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
