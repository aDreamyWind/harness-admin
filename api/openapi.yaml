      responses:
        '200':
          description: 登录成功，同时写入会话与 CSRF Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: 账号因连续登录失败已被锁定，需要管理员解锁。
        '429':
          description: 登录失败次数过多。
  /auth/me:
    get:
      summary: 获取当前登录用户
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: 退出登录
      operationId: logout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 会话已吊销。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/password:
    put:
      summary: 修改当前账号密码
      description: 修改成功后保留当前会话，并吊销当前账号的其他会话。
      operationId: changeCurrentPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码已修改。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeEnvelope'
        '400':
          description: 密码参数不正确或当前密码错误。
        '409':
          description: 新密码与当前密码相同。
  /auth/profile:
    put:
      summary: 修改当前账号资料
      description: 修改当前登录用户的显示名称和邮箱，登录用户名不可修改。
      operationId: updateCurrentUserProfile
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 个人资料已更新。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 邮箱已被当前企业内其他用户使用。
  /auth/sessions:
    get:
      summary: 查询当前账号的活跃会话
      operationId: listCurrentUserSessions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 未过期且未吊销的会话，当前会话优先返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionListEnvelope'
  /auth/sessions/{sessionId}:
    delete:
      summary: 吊销指定会话
      description: 只能吊销当前账号名下的非当前会话。
      operationId: revokeCurrentUserSession
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 会话已吊销。
        '404':
          description: 会话不存在或已经失效。
        '409':
          description: 不能通过会话管理吊销当前会话。
  /auth/sessions/revoke-others:
    post:
      summary: 吊销当前账号的其他会话
      operationId: revokeOtherCurrentUserSessions
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 其他会话已吊销，当前会话保持登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevocationEnvelope'
  /users:
    get:
      summary: 查询当前企业用户
      operationId: listUsers
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, locked, disabled]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页用户列表，需要 `iam.user.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 创建用户
      operationId: createUser
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 用户创建成功，需要 `iam.user.write` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 用户名或邮箱已存在。
  /users/{userId}:
    put:
      summary: 修改用户资料
      description: 修改显示名称和邮箱；登录用户名创建后不可修改。需要 `iam.user.write` 权限。
      operationId: updateUser
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 用户资料修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户不存在。
        '409':
          description: 邮箱已被当前企业内其他用户使用。
  /users/{userId}/status:
    patch:
      summary: 修改用户状态
      operationId: changeUserStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: 状态修改成功；停用时会吊销该用户全部会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '404':
          description: 用户不存在。
        '409':
          description: 不能停用当前登录账号；锁定用户必须使用解锁接口。
  /users/{userId}/password:
    put:
      summary: 重置用户密码
      description: 重置成功后吊销目标用户的全部会话；不能通过该接口重置当前登录账号。
      operationId: resetUserPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 密码已重置，需要 `iam.user.write` 权限。
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户不存在。
        '409':
          description: 不能重置当前登录账号的密码。
  /users/{userId}/unlock:
    post:
      summary: 解锁用户
      description: 清除目标账号的登录失败计数并恢复为正常状态，需要 `iam.user.write` 权限。
      operationId: unlockUser
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 用户已解锁，可以重新登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '404':
          description: 用户不存在。
        '409':
          description: 用户当前未被锁定。
  /users/{userId}/roles:
    put:
      summary: 设置用户角色
      operationId: assignUserRoles
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: 用户角色已更新，需要 `iam.user.write` 权限。
        '404':
          description: 用户或角色不存在。
        '409':
          description: 不能修改当前登录账号的角色。
  /users/{userId}/department:
    patch:
      summary: 调整用户所属部门
      operationId: assignUserDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId]
              properties:
                departmentId:
                  type: string
                  description: 部门 UUID；空字符串表示清除部门归属。
      responses:
        '200':
          description: 用户部门已更新，需要 `iam.user.write` 权限。
        '404':
          description: 用户不存在。
  /organization:
    get:
      summary: 获取当前企业资料
      operationId: getOrganization
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前登录用户所属企业，需要 `iam.organization.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: 修改当前企业资料
      description: 仅修改企业展示名称；企业编码作为登录和数据隔离标识不可修改。需要 `iam.organization.write` 权限。
      operationId: updateOrganization
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: 企业资料修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 企业不存在。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /departments:
    get:
      summary: 查询当前企业部门
      operationId: listDepartments
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 部门平铺列表，通过 parentId 表达层级，需要 `iam.department.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentListEnvelope' }
    post:
      summary: 创建部门
      operationId: createDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartmentRequest' }
      responses:
        '201':
          description: 部门创建成功，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 部门代码已存在。
  /departments/{departmentId}:
    put:
      summary: 修改部门
      operationId: updateDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDepartmentRequest' }
      responses:
        '200':
          description: 部门已更新，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 不能移动到自身或下级部门。
  /departments/{departmentId}/status:
    patch:
      summary: 修改部门状态
      operationId: changeDepartmentStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 部门状态已更新，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 部门下仍有启用中的子部门或用户。
  /roles:
    get:
      summary: 查询当前企业角色
      operationId: listRoles
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 角色列表，需要 `iam.role.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListEnvelope'
    post:
      summary: 创建角色
      operationId: createRole
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: 角色创建成功，需要 `iam.role.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '409':
          description: 角色代码已存在。
  /roles/{roleId}:
    put:
      summary: 修改自定义角色
      operationId: updateRole
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: 角色已更新，需要 `iam.role.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '409':
          description: 系统内置角色不允许修改。
  /permissions:
    get:
      summary: 查询系统权限定义
      operationId: listPermissions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 权限列表，需要 `iam.role.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionListEnvelope' }
  /audit-events:
    get:
      summary: 查询当前企业审计事件
      operationId: listAuditEvents
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: 模糊匹配动作、资源、请求 ID 或操作人。
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, denied, failed] }
        - name: startedAt
          in: query
          schema: { type: string, format: date-time }
        - name: endedAt
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页审计事件列表，需要 `audit.event.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventListEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-events/{eventId}:
    get:
      summary: 查询审计事件详情
      operationId: getAuditEvent
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: 当前企业内的审计事件详情，需要 `audit.event.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventEnvelope' }
        '404':
          description: 审计事件不存在或不属于当前企业。
  /oidc/clients:
    get:
      summary: 查询当前企业的统一登录应用
      operationId: listOIDCClients
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 应用列表，不返回完整客户端密钥，需要 `oidc.client.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建统一登录应用
      description: 桌面应用是公开客户端，不生成密钥；服务端应用同时保存用于认证的 SHA-256 哈希和使用主密钥加密的密文，具备管理权限时可再次查看。
      operationId: createOIDCClient
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCClientWriteRequest' }
      responses:
        '201':
          description: 应用已创建；服务端应用的响应包含客户端密钥，后续也可通过密钥查看接口读取。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOIDCClientEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /oidc/clients/{oidcClientId}:
    put:
      summary: 修改统一登录应用
      operationId: updateOIDCClient
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          description: 应用记录标识，不是对外的 client_id。
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCClientWriteRequest' }
      responses:
        '200':
          description: 应用设置已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
  /oidc/clients/{oidcClientId}/status:
    patch:
      summary: 修改统一登录应用状态
      operationId: changeOIDCClientStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 应用状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientEnvelope' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
  /oidc/clients/{oidcClientId}/rotate-secret:
    post:
      summary: 轮换统一登录应用的客户端密钥
      operationId: rotateOIDCClientSecret
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 密钥已轮换，旧密钥立即失效，响应包含新密钥且后续可再次查看。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOIDCClientEnvelope' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
        '409': { description: 桌面应用不使用客户端密钥。 }
  /oidc/clients/{oidcClientId}/secret:
    get:
      summary: 查看统一登录应用的客户端密钥
      description: 需要 `oidc.client.write` 权限；每次成功查看都会写入审计日志，响应禁止缓存。历史未保存密文的应用需先轮换密钥。
      operationId: revealOIDCClientSecret
      security:
        - sessionCookie: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 返回解密后的完整客户端密钥。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretEnvelope' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
        '409': { description: 桌面应用不使用密钥，或历史密钥没有可解密密文。 }
  /.well-known/openid-configuration:
    servers:
      - url: /
    get:
      summary: 获取 OpenID Connect 发现文档
      operationId: getOIDCDiscovery
      responses:
        '200':
          description: OIDC Provider 元数据。
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /oauth2/jwks:
    get:
      summary: 获取 OIDC RSA 公钥集
      operationId: getOIDCJWKS
      responses:
        '200':
          description: 用于校验 RS256 身份令牌和访问令牌的 JSON Web Key Set。
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /oauth2/authorize:
    get:
      summary: 发起 OIDC 授权码登录
      description: 要求当前 Harness Admin 用户会话有效，并强制使用 PKCE S256。未登录时跳转到管理端登录页；用户尚未同意或应用新增权限时跳转到授权确认页。桌面应用登记 IP 回环地址时，实际授权请求可使用随机端口。
      operationId: authorizeOIDC
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string, maxLength: 255 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      responses:
        '302': { description: 跳转到登录页、授权确认页或客户端登记的回调地址。 }
        '400':
          description: 授权请求不正确。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /oauth2/consent:
    get:
      summary: 读取当前 OIDC 授权请求
      description: 在授权确认页展示前重新校验应用、回调地址、PKCE 和申请范围。
      operationId: getOIDCConsentRequest
      security:
        - sessionCookie: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string, maxLength: 255 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      responses:
        '200':
          description: 已校验的应用和申请权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCAuthorizationRequestEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: 同意或拒绝 OIDC 应用授权
      operationId: decideOIDCConsent
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string, maxLength: 255 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCConsentDecision' }
      responses:
        '200':
          description: 返回客户端回调地址；拒绝时回调包含 access_denied。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCConsentResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /account/authorized-applications:
    get:
      summary: 查询当前用户已授权应用
      operationId: listCurrentUserAuthorizedApplications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户尚未撤销的应用授权。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizedApplicationListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /account/authorized-applications/{consentId}:
    delete:
      summary: 撤销当前用户的应用授权
      description: 撤销授权并立即使该应用的未兑换授权码和现有刷新令牌失效；已经签发的访问令牌仍按原有效期到期。
      operationId: revokeCurrentUserAuthorizedApplication
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: consentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 应用授权已撤销。 }
        '404': { description: 应用授权不存在或已经撤销。 }
  /oauth2/token:
    post:
      summary: 兑换或刷新 OIDC 令牌
      operationId: exchangeOIDCToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OIDCTokenRequest'
      responses:
        '200':
          description: 令牌签发成功；刷新令牌仅在授权包含 offline_access 时返回。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCTokenResponse' }
        '400':
          description: 授权码、PKCE 或刷新令牌无效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: 客户端认证失败。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /oauth2/userinfo:
    get:
      summary: 获取 OIDC 当前用户资料
      operationId: getOIDCUserInfo
      security:
        - oidcBearer: []
      responses:
        '200':
          description: 返回内容按令牌 scope 过滤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCUserInfo' }
        '401':
          description: Bearer 访问令牌无效或已过期。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /model-providers:
    get:
      summary: 查询当前企业的模型供应商连接
      operationId: listModelProviders
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 供应商连接列表，需要 `model.provider.read` 权限；响应不包含访问凭据。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建模型供应商连接
      operationId: createModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelProviderRequest' }
      responses:
        '201':
          description: 供应商连接已创建，API Key 已加密保存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 企业内供应商连接编码已存在。 }
  /model-providers/{providerId}:
    put:
      summary: 修改模型供应商连接
      description: "apiKey 省略时保留当前凭据；提供时替换加密凭据。"
      operationId: updateModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelProviderRequest' }
      responses:
        '200':
          description: 供应商连接已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
        '404': { description: 供应商连接不存在。 }
  /model-providers/{providerId}/status:
    patch:
      summary: 修改模型供应商连接状态
      operationId: changeModelProviderStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 供应商连接状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
  /model-providers/{providerId}/probe:
    post:
      summary: 检测模型供应商连接
      description: 使用加密保存的凭据读取上游模型列表，不发送业务数据。
      operationId: probeModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 连接检测成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderProbeEnvelope' }
        '409': { description: 供应商连接已停用。 }
        '502': { description: 无法连接供应商，或供应商拒绝凭据。 }
  /model-providers/{providerId}/credential:
    get:
      summary: 查看模型供应商 API Key
      description: 需要 `model.provider.write` 权限；每次成功查看都会写入审计日志，响应禁止缓存。
      operationId: revealModelProviderCredential
      security:
        - sessionCookie: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 返回解密后的完整 API Key。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretEnvelope' }
        '404': { description: 供应商连接不存在或不属于当前企业。 }
  /model-providers/{providerId}/discover-models:
    post:
      summary: 从供应商读取可用模型列表
      description: 需要 `model.catalog.write` 权限；使用已保存的凭据，最多返回 500 项，不写入目录。
      operationId: discoverProviderModels
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 上游模型列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveredModelListEnvelope' }
        '409': { description: 供应商连接已停用。 }
        '502': { description: 上游列表请求失败。 }
  /model-providers/{providerId}/import-models:
    post:
      summary: 将选中的上游模型批量导入目录
      description: 重新读取上游列表并核对所选标识；事务内导入，重复项跳过，新模型默认为停用。可选同时启用所有新导入模型；图片和视频模型在供应商协议受支持时可使用各自的网关入口。
      operationId: importProviderModels
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upstreamModelIds]
              properties:
                upstreamModelIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 200 }
                activateSupportedChat:
                  type: boolean
                  default: false
                  deprecated: true
                  description: 旧版兼容字段；仅启用对话类型且当前网关支持的协议。新客户端请使用 activateImportedModels。
                activateImportedModels:
                  type: boolean
                  default: false
                  description: 同时启用所有新导入模型；已接入的对话、图片、视频协议分别使用各自的网关入口，其余类型仅在目录中启用。
      responses:
        '200':
          description: 批量导入结果。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [imported, skipped, activated]
                    properties:
                      imported: { type: integer, minimum: 0 }
                      skipped: { type: integer, minimum: 0 }
                      activated: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: 上游列表请求失败。 }
  /models:
    get:
      summary: 查询当前企业的模型目录
      operationId: listModels
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 模型目录列表，需要 `model.catalog.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogListEnvelope' }
    post:
      summary: 创建模型目录项
      operationId: createModel
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelRequest' }
      responses:
        '201':
          description: 模型目录项已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
        '409': { description: 模型编码或供应商侧模型标识已存在。 }
  /models/batch-status:
    patch:
      summary: 批量启用或停用模型目录项
      description: 仅处理当前企业的模型；一个或多个 ID 不存在时整批不修改。已处于目标状态的模型不计入 changed。需要 model.catalog.write 权限。
      operationId: batchChangeModelStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelIds, status]
              properties:
                modelIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: { type: string, format: uuid }
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 批量修改已提交。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [changed]
                    properties:
                      changed: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 一个或多个模型不存在或不属于当前企业；整批不修改。 }
  /models/{modelId}:
    put:
      summary: 修改模型目录项
      operationId: updateModel
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelRequest' }
      responses:
        '200':
          description: 模型目录项已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
        '404': { description: 模型或供应商连接不存在。 }
  /models/{modelId}/status:
    patch:
      summary: 修改模型状态
      operationId: changeModelStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 模型状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
  /model-policies:
    get:
      summary: 查询部门和用户的模型策略
      operationId: listModelPolicies
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前企业的模型策略及本月用量，需要 `model.policy.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPolicyListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-policies/departments:
    put:
      summary: 批量设置部门模型策略
      description: 在一个事务中为所列部门分别设置相同策略，各部门的共享额度池独立。只对请求中明确列出的部门生效，不自动覆盖现有或今后新增的下级部门。需要 `model.policy.write` 权限。
      operationId: saveDepartmentModelPolicies
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDepartmentModelPoliciesRequest' }
      responses:
        '200':
          description: 所选部门的策略已原子保存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPolicyListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 一个或多个部门不属于当前企业。 }
  /model-policies/{subjectType}/{subjectId}:
    parameters:
      - name: subjectType
        in: path
        required: true
        schema: { type: string, enum: [department, user] }
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: 设置部门或用户的模型策略
      description: 用户模型范围可覆盖其所属部门的模型范围；所属部门及用户的月度额度同时生效，上级部门策略不穿透。每分钟请求上限始终按用户独立计算。需要 `model.policy.write` 权限。
      operationId: saveModelPolicy
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveModelPolicyRequest' }
      responses:
        '200':
          description: 策略已保存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPolicyEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 部门或用户不属于当前企业。 }
    delete:
      summary: 删除部门或用户的模型策略
      description: 删除策略后恢复默认规则；对应的月度策略用量一并删除。需要 `model.policy.write` 权限。
      operationId: deleteModelPolicy
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': { description: 策略已删除。 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 策略不存在。 }
  /model-gateway/api-keys:
    get:
      summary: 查询当前企业的模型网关调用密钥
      operationId: listModelGatewayAPIKeys
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 调用密钥列表，仅返回非敏感前缀，需要 `model.gateway.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建模型网关调用密钥
      description: 服务端同时保存用于认证的 SHA-256 哈希和使用主密钥加密的密文，具备管理权限时可再次查看。
      operationId: createModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGatewayAPIKeyRequest' }
      responses:
        '201':
          description: 调用密钥已创建，响应包含完整密钥，后续也可通过密钥查看接口读取。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedGatewayAPIKeyEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /model-gateway/api-keys/{apiKeyId}/revoke:
    patch:
      summary: 吊销模型网关调用密钥
      operationId: revokeModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 调用密钥已吊销，立即停止接受新调用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyEnvelope' }
        '404': { description: 调用密钥不存在或不属于当前企业。 }
  /model-gateway/api-keys/{apiKeyId}:
    put:
      summary: 修改模型网关调用密钥
      description: 修改名称、过期时间、限流、月度 Token 额度和可用模型范围，不更换密钥值。
      operationId: updateModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGatewayAPIKeyRequest' }
      responses:
        '200':
          description: 调用密钥设置已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 调用密钥不存在或不属于当前企业。 }
  /model-gateway/api-keys/{apiKeyId}/secret:
    get:
      summary: 查看模型网关调用密钥
      description: 需要 `model.gateway.write` 权限；每次成功查看都会写入审计日志，响应禁止缓存。历史未保存密文的密钥需重新创建。
      operationId: revealModelGatewayAPIKeySecret
      security:
        - sessionCookie: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 返回解密后的完整调用密钥。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretEnvelope' }
        '404': { description: 调用密钥不存在或不属于当前企业。 }
        '409': { description: 历史调用密钥没有可解密密文，需要重新创建。 }
  /model-gateway/calls:
    get:
      summary: 查询当前企业的模型网关调用记录
      description: 不保存提示词与模型回答，支持按调用密钥、模型编码、结果和时间范围查询。
      operationId: listModelGatewayCalls
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: apiKeyId
          in: query
          schema: { type: string, format: uuid }
        - name: modelCode
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, failed] }
        - name: startedAt
          in: query
          schema: { type: string, format: date-time }
        - name: endedAt
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 网关调用记录，需要 `model.gateway.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayCallPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-gateway/usage:
    get:
      summary: 查询模型网关月度用量
      description: 按 UTC 自然月汇总；部门和用户维度只包含 OIDC 用户调用，模型维度包含用户和调用密钥。缺少上游 usage 的调用计为用量未知，不当作零 Token。需要 `model.gateway.read` 权限。
      operationId: listModelGatewayUsage
      security:
        - sessionCookie: []
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: UTC 月份，格式 YYYY-MM；省略时为当前 UTC 月。
        - name: groupBy
          in: query
          schema: { type: string, enum: [department, user, model], default: department }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 月度用量分页汇总。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayUsagePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-gateway/alerts:
    get:
      summary: 查询并刷新模型网关站内预警
      description: 查询当前 UTC 月时按实时已统计用量刷新记录，并按企业、月份和对象去重；历史月份只读取记录。额度达到 80% 预警、达到 100% 紧急。模型成功调用至少 5 次用量未知且占比至少 20% 时预警。部门按人额度逐人判断，不把部门合计与个人上限比较。需要 `model.gateway.read` 权限。
      operationId: listModelGatewayAlerts
      security:
        - sessionCookie: []
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: UTC 月份，格式 YYYY-MM；省略时为当前 UTC 月。
        - name: status
          in: query
          schema: { type: string, enum: [active, all], default: active }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 预警记录及当前有效预警总数。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAlertPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-gateway/alerts/settings:
    get:
      summary: 查询站内预警后台刷新设置
      description: 按企业读取开关；尚未保存时默认关闭。需要 `model.gateway.read` 权限。
      operationId: getModelGatewayAlertSettings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 站内预警后台刷新设置。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAlertSettingsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: 修改站内预警后台刷新设置
      description: 开启后由服务端每分钟刷新当前 UTC 月预警；关闭后仅管理员打开站内预警页签或手动刷新时计算。需要 `model.gateway.write` 权限和 CSRF 校验。
      operationId: updateModelGatewayAlertSettings
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoRefreshEnabled]
              properties:
                autoRefreshEnabled: { type: boolean }
      responses:
        '200':
          description: 更新后的设置。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAlertSettingsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-gateway/alerts/{id}/acknowledge:
    post:
      summary: 标记模型网关预警为已知悉
      description: 仅可确认本企业尚未解除的预警；严重程度从提醒升级为紧急或解除后重新出现时，会清除确认状态。需要 `model.gateway.write` 权限和 CSRF 校验。
      operationId: acknowledgeModelGatewayAlert
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已知悉的预警。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAlertEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/models:
    servers:
      - url: /
    get:
      summary: OpenAI 兼容可用模型目录
      description: 使用网关调用密钥或带 `model.invoke` scope 的 OIDC 用户令牌；只返回当前身份有权使用且模型与供应商均已启用的模型。
      operationId: listGatewayModels
      security:
        - gatewayBearer: []
        - oidcBearer: []
      responses:
        '200':
          description: OpenAI 兼容模型列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIModelList' }
        '401': { description: 调用身份无效、已吊销或已过期。 }
  /v1/chat/completions:
    servers:
      - url: /
    post:
      summary: OpenAI 兼容聊天补全入口
      description: 使用企业模型编码选择已启用且当前身份有权调用的模型，支持流式与非流式响应透传。可使用网关调用密钥，或包含 `model.invoke` scope 的 OIDC 用户访问令牌。用户调用还受部门共享及个人请求上限、月度额度约束。
      operationId: gatewayChatCompletions
      security:
        - gatewayBearer: []
        - oidcBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string, description: 企业模型目录中的模型编码。 }
                messages:
                  type: array
                  items: { type: object, additionalProperties: true }
                stream: { type: boolean, default: false }
              additionalProperties: true
      responses:
        '200':
          description: 上游 OpenAI 兼容响应，流式调用返回 `text/event-stream`。
        '400': { description: 请求格式不正确。 }
        '401': { description: 调用密钥无效、已吊销或已过期。 }
        '403': { description: 当前调用身份无权访问请求的模型。 }
        '404': { description: 模型编码不存在。 }
        '409': { description: 模型或供应商连接已停用。 }
        '429': { description: 超过调用身份、部门或用户的每分钟请求限制，或当月 Token 额度已用尽。 }
        '502': { description: 无法连接模型供应商。 }
  /v1/images/generations:
    servers:
      - url: /
    post:
      summary: 生成图片
      description: 使用企业模型编码调用已启用的图片模型。百炼旧公共域名由网关转换为 DashScope 原生同步图片协议，业务空间专属域名及其他兼容供应商使用 OpenAI 图片协议；响应统一含 data[].url。调用身份、模型范围、请求限流与审计沿用模型网关。图片链接可能限时有效，实际调用还取决于供应商授权及地域。
      operationId: gatewayImageGenerations
      security:
        - gatewayBearer: []
        - oidcBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model: { type: string, description: 企业图片模型编码。 }
                prompt: { type: string, minLength: 1 }
              additionalProperties: true
      responses:
        '200': { description: 上游图片生成响应。 }
        '400': { description: 请求格式错误或模型类型不匹配。 }
        '401': { description: 调用身份无效。 }
        '403': { description: 网关或上游拒绝调用；百炼上游错误会返回含 code、message、request_id 的 JSON。 }
        '404': { description: 模型编码不存在。 }
        '409': { description: 模型或供应商已停用。 }
        '429': { description: 请求频率或 Token 额度限制。 }
        '502': { description: 无法连接模型供应商。 }
  /v1/videos/generations:
    servers:
      - url: /
    post:
      summary: 提交百炼视频生成任务
      description: 使用企业视频模型编码提交百炼异步视频任务。请求体采用百炼 video-synthesis 的 input 与 parameters 结构，网关会将 output.task_id 替换为网关任务 ID；用该 ID 查询结果。任务只允许原调用密钥或原用户查询。
      operationId: gatewayVideoGenerations
      security:
        - gatewayBearer: []
        - oidcBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string, description: 企业视频模型编码。 }
                input: { type: object, additionalProperties: true, description: 百炼视频生成输入，例如 prompt。 }
                parameters: { type: object, additionalProperties: true, description: 供应商视频生成参数。 }
              additionalProperties: true
      responses:
        '200': { description: 视频任务已提交，output.task_id 为网关任务 ID。 }
        '400': { description: 请求格式错误或模型类型不匹配。 }
        '401': { description: 调用身份无效。 }
        '403': { description: 网关或上游拒绝调用；百炼上游错误会返回含 code、message、request_id 的 JSON。 }
        '404': { description: 模型编码不存在。 }
        '409': { description: 模型或供应商已停用。 }
        '429': { description: 请求频率或 Token 额度限制。 }
        '502': { description: 上游请求或任务保存失败。 }
  /v1/videos/tasks/{taskId}:
    servers:
      - url: /
    get:
      summary: 查询视频生成任务
      description: 查询由当前调用密钥或当前 OIDC 用户创建的网关任务；返回中的 output.task_id 保持为网关任务 ID。上游视频结果链接可能限时有效。
      operationId: gatewayGetVideoTask
      security:
        - gatewayBearer: []
        - oidcBearer: []
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 上游任务状态及完成后的结果。 }
        '400': { description: 任务标识格式错误。 }
        '401': { description: 调用身份无效。 }
        '404': { description: 任务不存在或不属于当前调用身份。 }
        '502': { description: 无法查询视频供应商任务。 }
  /mcp-services:
    get:
      summary: 查询企业 MCP 服务
      operationId: listMCPServices
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前企业的远程 MCP 服务列表；要求 mcp.service.read 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServiceListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 登记远程 MCP 服务
      operationId: createMCPService
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPServiceInput' }
      responses:
        '201':
          description: 已登记；要求 mcp.service.write 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServiceEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 服务编码已存在。 }
  /mcp-services/{serviceId}/status:
    patch:
      summary: 启用或停用 MCP 服务
      operationId: changeMCPServiceStatus
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 状态已更新；要求 mcp.service.write 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServiceEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp-services/{serviceId}:
    put:
      summary: 修改 MCP 服务及参数配置
      operationId: updateMCPService
      description: 修改服务名称、描述、传输方式、上游地址及参数字段定义；参数值属于连接，不在此接口填写。要求 mcp.service.write 权限。
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPServiceInput' }
      responses:
        '200':
          description: 服务配置已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServiceEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp-services/{serviceId}/credentials:
    get:
      deprecated: true
      summary: 查看 MCP 服务的上游凭证
      operationId: revealMCPServiceCredentials
      description: 仅具有 mcp.service.write 权限的管理员可查看；操作写入审计。
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 已解密的服务级上游参数值。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MCPUpstreamCredentials' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      deprecated: true
      summary: 替换 MCP 服务的上游凭证
      operationId: updateMCPServiceCredentials
      description: 仅兼容历史服务级凭证；仅旧连接可继续继承，新连接不继承。新流程应把参数值填写在连接中。要求 mcp.service.write 权限。
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/MCPUpstreamCredentials' }
                - type: object
                  properties:
                    definitions:
                      type: array
                      description: 可选；同时替换服务参数字段定义，省略时保持不变。
                      items: { $ref: '#/components/schemas/MCPParameterDefinition' }
      responses:
        '200':
          description: 服务级上游凭证已加密保存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServiceEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp-services/{serviceId}/tools:
    get:
      summary: 查看 MCP 工具快照
      operationId: listMCPServiceTools
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 最近发现的工具列表；要求 mcp.service.read 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPToolListEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp-services/{serviceId}/discover:
    post:
      summary: 从上游发现 MCP 工具
      description: 可指定当前服务下的一条有效连接，使用其已保存的参数值发现工具；不指定连接时仅适用于无需参数的服务。要求 mcp.service.write 权限。
      operationId: discoverMCPServiceTools
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPUpstreamRequest' }
      responses:
        '200':
          description: 已发现并保存工具快照。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPToolListEnvelope' }
        '502': { description: 上游 MCP 连接或工具发现失败。 }
  /mcp-services/{serviceId}/test:
    post:
      summary: 测试调用 MCP 工具
      description: 会真实执行上游工具，可能产生业务副作用；不保存工具入参与返回内容；要求 mcp.service.write 权限。
      operationId: testMCPServiceTool
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPToolTestRequest' }
      responses:
        '200': { description: MCP 工具原始调用结果。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: 上游 MCP 工具调用失败。 }
  /mcp-deployments/capability:
    get:
      summary: 查询源码部署能力开关
      operationId: getMCPDeploymentCapability
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 返回是否启用 Docker 托管部署；要求 mcp.service.read 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPDeploymentCapabilityEnvelope' }
  /mcp-deployments/inspect/repository:
    post:
      summary: 预检公开仓库的固定版本、Node.js 构建命令与运行入口；不创建服务、不执行源码
      operationId: inspectMCPRepository
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryUrl]
              properties:
                repositoryUrl: { type: string, description: GitHub 或 Gitee 公开仓库完整 HTTPS 地址。 }
                ref: { type: string, description: 分支、标签或提交；留空使用默认分支。 }
      responses:
        '200':
          description: 返回固定提交号、识别的运行入口和依赖锁文件状态；要求 mcp.service.write 权限。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revision, entryFile, buildCommand, hasLockfile]
                    properties:
                      revision: { type: string }
                      entryFile: { type: string }
                      buildCommand: { type: string, description: npm run build 或空字符串。 }
                      hasLockfile: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { description: 仓库读取或运行入口识别失败。 }
        '503': { description: 服务器未开启源码部署。 }
  /mcp-deployments/import/repository:
