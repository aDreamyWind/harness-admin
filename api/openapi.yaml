      properties:
        connectionId: { type: string, format: uuid }
        status: { type: string, enum: [healthy, unavailable, inactive] }
        message: { type: string }
        toolCount: { type: integer, minimum: 0 }
        checkedAt: { type: string, format: date-time }
    MCPConnectionHealthEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MCPConnectionHealth' }
    MCPUsage:
      type: object
      required: [connectionId, toolName, calls, failures, averageMs]
      properties:
