      type: object
      required: [startOffset, endOffset, boundary]
      properties:
        startOffset: { type: integer, minimum: 0 }
        endOffset: { type: integer, minimum: 1 }
        boundary: { type: string, enum: [episode, chapter, paragraph, limit, end] }
    DramaBatchRangeChange:
      type: object
      required: [startOffset, endOffset, revision]
      properties:
        startOffset: { type: integer, minimum: 0 }
        endOffset: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
    DramaBatch:
      type: object
      required: [id, projectId, name, nameManuallyEdited, number, startOffset, endOffset, selectionMode, boundary, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        nameManuallyEdited: { type: boolean, description: 手动命名后 AI 不覆盖。 }
        analysisRunId: { type: string, format: uuid, readOnly: true, description: 当前解析运行标识，继续沿用、重新解析更新。 }
        number: { type: integer, minimum: 1 }
        startOffset: { type: integer, minimum: 0 }
        endOffset: { type: integer, minimum: 1 }
