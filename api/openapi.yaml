        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DramaProject:
      type: object
      required: [id, title, sourceLength, sourceMode, style, aspectRatio, modelCode, status, phase, overview, characters, scenes, props, episodes, createdAt, updatedAt]
      properties:
        styleId: { type: string, maxLength: 80, description: 服务端风格目录主键。 }
