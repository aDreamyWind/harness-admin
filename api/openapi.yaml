        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 65536, description: MCP 服务说明，支持 Markdown；托管服务直接读取当前版本根目录 README.md。 }
        transport: { type: string, enum: [streamable_http, sse] }
        upstreamUrl: { type: string, format: uri, description: 不允许 URL 用户信息、查询参数和片段。 }
        parameters:
          type: array
