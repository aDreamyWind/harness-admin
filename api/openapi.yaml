        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: 已启动，返回解析中的批次。
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/DramaBatch' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 批次正在解析，或项目尚未完成概览解析。 }
  /ai-drama/projects/{id}/batches/{batchId}/resume:
    post:
      summary: 从失败处继续解析，保留已完成步骤
      description: 只允许失败且原文范围未变化的批次；沿用该次运行保存的模型和概览快照。
      operationId: resumeDramaBatch
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: 已继续解析。
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/DramaBatch' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 任务不是失败状态、原文范围变化或已在运行。 }
  /ai-drama/projects/{id}/batches/{batchId}/events:
    get:
      summary: 订阅真实解析事件和流式剧本正文
      operationId: streamDramaBatchEvents
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: integer, minimum: 0 }, description: 断线续传游标，优先于 after。 }
      responses:
        '200':
          description: SSE progress 事件以 DramaBatchEvent 为 data；batch-state 事件返回终态并关闭流。delta 为待校验的正文增量，不含模型推理。按事件 id 去重，重连可传游标。
          content: { text/event-stream: { schema: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
