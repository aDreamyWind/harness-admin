        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        '200':
          description: 托管服务名称已更新，README 描述保持不变。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServiceEnvelope' }
  /mcp-deployments/{serviceId}/start:
    post:
      summary: 启动托管 MCP 容器
      operationId: startMCPDeployment
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已启动；返回 MCPServiceEnvelope。 }
  /mcp-deployments/{serviceId}/stop:
    post:
      summary: 停止托管 MCP 容器
      operationId: stopMCPDeployment
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已停止；返回 MCPServiceEnvelope。 }
  /mcp-deployments/{serviceId}/restart:
    post:
      summary: 重启托管 MCP 容器
      operationId: restartMCPDeployment
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已重启；返回 MCPServiceEnvelope。 }
  /mcp-deployments/{serviceId}/rollback:
    post:
      summary: 切换到已构建的历史镜像并启动
      operationId: rollbackMCPDeployment
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId]
              properties:
                versionId: { type: string, format: uuid }
      responses:
        '200': { description: 已回退；需要重新发现工具。 }
  /mcp-connections:
    get:
      summary: 查询企业 MCP 对外连接
      operationId: listMCPConnections
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前企业连接列表；要求 mcp.connection.read 权限，不返回任何密钥。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnectionListEnvelope' }
    post:
      summary: 生成 MCP 对外连接
      operationId: createMCPConnection
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPConnectionInput' }
      responses:
        '201':
          description: 已创建；Bearer 入口密钥只在此响应及管理员再次查看接口中出现。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedMCPConnectionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 连接编码已存在或上游服务停用。 }
  /mcp-connections/{connectionId}/status:
    patch:
      summary: 启用或停用 MCP 连接
      operationId: changeMCPConnectionStatus
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 连接状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnectionEnvelope' }
  /mcp-connections/{connectionId}/health:
    get:
      summary: 按需检查 MCP 连接的上游连通状态
      description: 要求 mcp.connection.read 权限；使用此连接专有上游参数进行 MCP 握手和工具列表读取，不执行工具，也不写入调用统计。页面打开时检查一次，不后台轮询。
      operationId: checkMCPConnectionHealth
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 返回正常、异常或未启用状态；不返回上游密钥或原始错误。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnectionHealthEnvelope' }
        '404': { description: 连接不属于当前企业或不存在。 }
  /mcp-connections/{connectionId}/grants:
    put:
      summary: 替换 Harness MCP 连接的员工授权
      description: 只保存最终明确选中的部门和用户；新建下级部门不自动继承。空数组会撤销全部授权。
      operationId: replaceMCPConnectionGrants
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentIds, userIds]
              properties:
                departmentIds: { type: array, items: { type: string, format: uuid } }
                userIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: 员工授权已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnectionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp-connections/{connectionId}/secret:
    get:
      summary: 再次查看开发者 MCP 连接入口密钥
      operationId: revealMCPConnectionSecret
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 要求 mcp.connection.write 权限；记录查看审计且禁止缓存。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string }
  /mcp-connections/{connectionId}/rotate-secret:
    post:
      summary: 轮换开发者 MCP 连接入口密钥
      description: 仅适用于 Bearer 鉴权的开发者连接。旧密钥在成功后立即失效；记录审计并禁止缓存。
      operationId: rotateMCPConnectionSecret
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 新入口密钥，可由管理员再次查看。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp-connections/{connectionId}/upstream-authorization:
    get:
      summary: 再次查看该连接的上游 Authorization
      operationId: revealMCPUpstreamAuthorization
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 要求 mcp.connection.write 权限；记录查看审计且禁止缓存。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      authorization: { type: string }
  /mcp-connections/{connectionId}/upstream-credentials:
    get:
      summary: 再次查看该连接的全部上游凭据
      operationId: revealMCPUpstreamCredentials
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 要求 mcp.connection.write 权限；记录查看审计且禁止缓存。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MCPUpstreamCredentials' }
    put:
      summary: 整体替换该连接的上游凭据
      description: 仅影响本连接；空对象清除所有上游凭据。记录审计，不回显密钥值。
      operationId: updateMCPUpstreamCredentials
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPUpstreamCredentials' }
      responses:
        '200':
          description: 已更新的连接元信息。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnectionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp-connections/usage:
    get:
      summary: 查询 MCP 连接与工具用量
      operationId: listMCPConnectionUsage
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 按连接和工具聚合的调用数、失败数及平均耗时。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPUsageListEnvelope' }
  /mcp/connections:
    get:
      summary: 查询当前员工获准使用的 MCP 连接
      operationId: listUserMCPConnections
      security: [{ oidcBearer: [] }]
      responses:
        '200':
          description: 仅返回员工有权使用的公开连接信息；令牌须包含 mcp.invoke scope。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPUserConnectionListEnvelope' }
        '401': { description: 员工访问令牌无效或缺少 mcp.invoke scope。 }
  /skills:
    get:
      summary: 查看当前企业的 Skill 资产
      operationId: listEnterpriseSkills
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Skill 资产列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillAssetListEnvelope' }
  /skills/import:
    post:
      summary: 导入不可变企业 Skill 版本
      description: 接受不超过 16 MiB 的 .zip 或 .tar.gz；ZIP 可带 GitHub 下载时生成的仓库顶层目录，但必须恰有一个 SKILL.md。拒绝越界路径、符号链接、无效 frontmatter 与超限文件。相同名称导入新版本，相同内容摘要返回 409。导入后不会自动发布或执行脚本。
      operationId: importEnterpriseSkill
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 已导入的 Skill 资产。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillAssetEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 与最新版本的内容相同。 }
  /skills/import/github:
    post:
      summary: 从公开 GitHub 仓库导入不可变企业 Skill 版本
      description: 将分支或标签解析成固定提交号，仅读取指定子目录的普通文件；导入后为草稿，不执行脚本。
      operationId: importEnterpriseSkillFromGitHub
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryUrl]
              properties:
                repositoryUrl: { type: string, format: uri, description: 公开 GitHub 仓库 HTTPS 地址。 }
                ref: { type: string, description: 可选分支、标签或完整提交号；留空使用默认分支。 }
                skillPath: { type: string, description: 可选的仓库内 Skill 相对目录；留空使用根目录。 }
      responses:
        '201':
          description: 已导入的资产及实际固定提交号。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubSkillImportEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 与最新版本的内容相同。 }
        '502': { description: GitHub 仓库读取失败。 }
  /skills/{skillId}/versions:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: 查看企业 Skill 的不可变版本与文件清单
      operationId: listEnterpriseSkillVersions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 版本按序号倒序排列。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersionListEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /skills/{skillId}/versions/{versionId}/files/{filePath}:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: filePath, in: path, required: true, description: 相对 Skill 根目录的路径，可以包含斜杠。, schema: { type: string } }
    get:
      summary: 预览企业 Skill 版本的原始文件
      operationId: readEnterpriseSkillVersionFile
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 原始文件字节；媒体类型来自导入时识别结果。 }
        '404': { $ref: '#/components/responses/NotFound' }
  /skills/{skillId}/versions/{versionId}/download:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: 下载企业 Skill 的固定版本 ZIP
      description: 仅供有 skill.asset.read 权限的管理员下载；从不可变版本生成，逐文件校验 SHA-256 与整版清单摘要。不执行文件，也不包含其他版本。响应禁止缓存。
      operationId: downloadEnterpriseSkillVersion
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 文件名为 <Skill 名称>-v<版本号>.zip，ZIP 内有 Skill 名称顶层目录。
          headers:
            Content-Disposition: { description: 附件下载文件名。, schema: { type: string } }
            Cache-Control: { description: 私有且不缓存。, schema: { type: string, example: 'private, no-store' } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /skills/{skillId}/publish:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: 发布指定 Skill 版本或停用资产
      operationId: publishEnterpriseSkill
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [published, disabled] }
                versionId: { type: string, format: uuid, description: 发布时必填，须属于此资产。 }
      responses:
        '200':
          description: 更新后的 Skill 资产。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillAssetEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /skills/{skillId}/grants:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: 整体替换企业 Skill 员工授权
      operationId: replaceEnterpriseSkillGrants
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentIds, userIds]
              properties:
                departmentIds: { type: array, items: { type: string, format: uuid } }
                userIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: 更新后的 Skill 资产。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillAssetEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /skills/directory:
    get:
      summary: 查询当前员工获准读取的企业 Skills
      description: OIDC 令牌须包含 mcp.invoke；仅返回已发布且当前用户或部门明确获授权的版本与文件摘要。
      operationId: listEmployeeSkills
      security: [{ oidcBearer: [] }]
      responses:
        '200':
          description: 员工可读的企业 Skill 清单。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedSkillListEnvelope' }
        '401': { description: 员工令牌无效或缺少 mcp.invoke。 }
  /skills/files/{name}/{filePath}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: filePath, in: path, required: true, description: 相对 Skill 根目录的路径，可以包含斜杠。, schema: { type: string } }
    get:
      summary: 读取当前员工获准的已发布 Skill 文件
      operationId: readEmployeeSkillFile
      security: [{ oidcBearer: [] }]
      responses:
        '200': { description: 原始文件字节；每次读取重新检查当前授权和发布状态。 }
        '404': { description: 文件不存在或员工无权读取。 }
  /enterprise-skills/mcp:
    servers:
      - url: /
    post:
      summary: 企业自有 Skills 的 Streamable HTTP MCP 入口
      description: OIDC 令牌须包含 mcp.invoke；支持 skills/list、skills/get 和通过 resources/read 读取 skill://enterprise/{name}/... 文件。每次请求按当前员工授权判断，响应禁止共享缓存。
      operationId: enterpriseSkillsMCPPost
      security: [{ oidcBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: MCP JSON-RPC 响应。 }
        '401': { description: 员工令牌无效。 }
    get:
      summary: 企业 Skills MCP 可选事件流入口
      operationId: enterpriseSkillsMCPGet
      security: [{ oidcBearer: [] }]
      responses:
        '405': { description: 无状态模式不提供独立 GET 事件流。 }
  /mcp/{code}:
    servers:
      - url: /
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      summary: Streamable HTTP MCP 网关入口
      description: 根据连接用途校验应用 Bearer 密钥或员工 OIDC 令牌；显式发布的匿名开发者连接可不携带令牌。支持 MCP tools/list、tools/call、resources/list、resources/templates/list、resources/read、prompts/list、prompts/get；上游声明 io.modelcontextprotocol/skills 时还提供 skills/list 和 skills/get，skill:// 文件通过 resources/read 读取。资源和提示词目录从上游读取，工具调用按连接和工具记录统计。
      operationId: mcpGatewayPost
      security: [{ gatewayBearer: [] }, { oidcBearer: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: MCP JSON-RPC 响应，可为 text/event-stream。 }
        '401': { description: 入口密钥或员工令牌无效。 }
        '403': { description: 员工未获授权。 }
        '409': { description: MCP 连接已停用、过期，或所属服务不可用；工具尚未发现时也返回此状态。 }
        '429': { description: 超过连接每分钟请求上限。 }
    get:
      summary: MCP 网关可选事件流入口
      operationId: mcpGatewayGet
      description: 当前使用无状态 Streamable HTTP；GET 返回 405，客户端应通过 POST 请求。
      responses:
        '405': { description: 此模式不提供独立 GET 事件流。 }
  /mcp/{code}/sse:
    servers:
      - url: /
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    get:
      summary: 旧版 HTTP+SSE MCP 兼容入口
      description: 兼容 MCP 2024-11-05 HTTP+SSE 传输。GET 建立最长 30 分钟的事件流，首个 endpoint 事件给出同一连接的消息提交地址；必须保持连接鉴权，员工令牌须包含 mcp.invoke。
      operationId: mcpLegacySSEConnect
      security: [{ gatewayBearer: [] }, { oidcBearer: [] }, {}]
      responses:
        '200': { description: text/event-stream，首个事件为 endpoint。 }
        '401': { description: 入口密钥或员工令牌无效。 }
        '403': { description: 员工未获授权或 Origin 不受信任。 }
        '409': { description: 连接已停用、过期或服务不可用。 }
        '429': { description: SSE 会话数量已达上限。 }
  /mcp/{code}/messages:
    servers:
      - url: /
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
      - { name: sessionid, in: query, required: true, schema: { type: string } }
    post:
      summary: 向旧版 SSE 会话提交 MCP 消息
      description: 使用 GET /mcp/{code}/sse 的 endpoint 事件返回的 URL；每次提交重新校验当前连接状态、入口凭据及员工授权，并核对会话所属员工。
      operationId: mcpLegacySSEMessage
      security: [{ gatewayBearer: [] }, { oidcBearer: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: 消息已提交；JSON-RPC 响应从 SSE 事件流返回。 }
        '400': { description: 缺少会话标识或消息无效。 }
        '401': { description: 入口密钥或员工令牌无效。 }
        '403': { description: 员工未获授权或 Origin 不受信任。 }
        '404': { description: 会话不存在、已结束或不属于当前员工。 }
        '409': { description: 连接已停用、过期或服务不可用。 }
        '429': { description: 请求过多。 }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: harness_admin_session
    platformSessionCookie:
      type: apiKey
      in: cookie
      name: harness_platform_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    gatewayBearer:
      type: http
      scheme: bearer
      bearerFormat: Harness gateway key
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 请求参数不正确。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或会话已失效。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 权限不足或 CSRF 校验失败。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 请求的资源不存在。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    DramaStyleOption:
      type: object
      additionalProperties: false
      required: [id, name, category, previewUrl, previewX, previewY]
      properties:
        id: { type: string, maxLength: 80 }
        name: { type: string }
        category: { type: string, description: 真人、2D、3D或历史。 }
        previewUrl: { type: string }
        previewX: { type: integer, minimum: 0, maximum: 2 }
        previewY: { type: integer, minimum: 0, maximum: 2 }
    DramaSourceReference:
      type: object
      required: [quote, startOffset, endOffset]
      properties:
        id: { type: string, description: 程序分配的句段编号，旧式引文兼容时可省略。 }
        quote: { type: string, description: 由程序从上传原文回填的真实文字。 }
        startOffset: { type: integer, minimum: 0 }
        endOffset: { type: integer, minimum: 1 }
    DramaAssetForm:
      type: object
      required: [id, assetId, assetName, kind, name, description, gender, style, aspectRatio, x, y, revision, imageStatus]
      properties:
        styleId: { type: string, maxLength: 80, description: 服务端风格目录主键。 }
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid, description: 始终关联真实项目资产，多个形象共享同一资产。 }
        assetName: { type: string }
        kind: { type: string, enum: [character, scene, prop] }
        parentId: { type: string, format: uuid, description: 同一资产的来源形象，默认形象省略。 }
        name: { type: string }
        description: { type: string }
        gender: { type: string, enum: [unspecified, male, female, other] }
        style: { type: string }
        aspectRatio: { type: string, enum: ['9:16', '16:9', '1:1'] }
        x: { type: number }
        y: { type: number }
        revision: { type: integer }
        imageUrl: { type: string, description: 需要项目所有者登录后读取的图片接口地址。 }
        imageStatus: { type: string, enum: [idle, queued, running, succeeded, failed] }
        imageError: { type: string }
    DramaCanvas:
      type: object
      required: [forms, x, y, zoom, revision]
      properties:
        forms: { type: array, items: { $ref: '#/components/schemas/DramaAssetForm' } }
        x: { type: number }
        y: { type: number }
        zoom: { type: number }
        revision: { type: integer }
    DramaCanvasLayout:
      type: object
      required: [revision, x, y, zoom, positions]
      properties:
        revision: { type: integer, minimum: 1 }
        x: { type: number, minimum: -1000000, maximum: 1000000 }
        y: { type: number, minimum: -1000000, maximum: 1000000 }
        zoom: { type: number, minimum: 0.05, maximum: 2 }
        positions:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [id, x, y]
            properties:
              id: { type: string, format: uuid }
              x: { type: number, minimum: -1000000, maximum: 1000000 }
              y: { type: number, minimum: -1000000, maximum: 1000000 }
    DramaCanvasRevision:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
    DramaFormEdit:
      type: object
      required: [revision, name, description, gender, aspectRatio]
      anyOf: [{ required: [styleId] }, { required: [style] }]
      properties:
        styleId: { type: string, maxLength: 80, description: 服务端风格目录主键。 }
        revision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 10000 }
        gender: { type: string, enum: [unspecified, male, female, other] }
        style: { type: string, maxLength: 120 }
        aspectRatio: { type: string, enum: ['9:16', '16:9', '1:1'] }
    DramaImageInput:
      type: object
      properties:
        prompt: { type: string, maxLength: 10000, description: 本次描述覆盖，省略或留空时使用形象描述，不修改长期形象内容。 }
    DramaVisualSaved:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean }
    DramaDerivedForm:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    DramaImageJob:
      type: object
      additionalProperties: false
      required: [id, projectId, formId, modelCode, styleId, aspectRatio, status]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        formId: { type: string, format: uuid }
        modelCode: { type: string }
        styleId: { type: string, description: 本次生成使用的风格编码，完整提示词仅保存在服务端。 }
        aspectRatio: { type: string }
        referenceId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        error: { type: string }
    DramaModel:
      type: object
      required: [code, name, modelType]
      properties:
        code: { type: string }
        name: { type: string }
        modelType: { type: string, enum: [chat, image, video] }
    DramaSettingsInput:
      type: object
      properties:
        textModelCode: { type: string, description: 剧本生成与解析使用的对话模型编码。 }
        imageModelCode: { type: string, description: 图片生成使用的模型编码。 }
        videoModelCode: { type: string, description: 视频生成使用的模型编码。 }
    DramaSettings:
      allOf:
        - { $ref: '#/components/schemas/DramaSettingsInput' }
        - type: object
          properties:
            updatedAt: { type: string, format: date-time }
    DramaCreateInput:
      type: object
      required: [title, sourceText, sourceMode, aspectRatio]
      anyOf: [{ required: [styleId] }, { required: [style] }]
      properties:
        styleId: { type: string, maxLength: 80, description: 服务端风格目录主键。 }
        title: { type: string, maxLength: 120 }
        sourceName: { type: string, maxLength: 255 }
        sourceText: { type: string, description: 完整原文或创意；不设置业务字数上限。 }
        sourceMode: { type: string, enum: [upload, generate] }
        style: { type: string, maxLength: 80 }
        aspectRatio: { type: string, enum: ['9:16', '16:9'] }
    DramaOverview:
      type: object
      properties:
        styleId: { type: string, maxLength: 80 }
        videoStyle: { type: string, maxLength: 80 }
        aspectRatio: { type: string, enum: ['9:16', '16:9', ''] }
        protagonist: { type: string }
        genre: { type: string }
        synopsis: { type: string }
        background: { type: string }
        setting: { type: string }
    DramaBatchReference:
      type: object
      required: [id, name, number]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 当前批次名称，通过主键实时读取。 }
        number: { type: integer, minimum: 1, description: 固定递增的批次编号。 }
    DramaAsset:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        sourceBatch:
          description: 首次提取该资产的批次，无法追溯时为空。
          anyOf: [{ $ref: '#/components/schemas/DramaBatchReference' }, { type: 'null' }]
        usedInBatches: { type: array, items: { $ref: '#/components/schemas/DramaBatchReference' }, description: 实际在剧集内引用该资产的批次，按ID去重。 }
        appearanceDescription: { type: string, description: 角色外貌与服饰描述。 }
        voiceDescription: { type: string, description: 角色音色与说话特征描述。 }
    DramaEpisode:
      type: object
      properties:
        title: { type: string }
        synopsis: { type: string }
    DramaSourceRange:
      type: object
      required: [startOffset, endOffset, totalLength, text]
      properties:
        startOffset: { type: integer, minimum: 0 }
        endOffset: { type: integer, minimum: 0 }
        totalLength: { type: integer, minimum: 1 }
        text: { type: string }
    DramaCatalogAsset:
      type: object
      required: [id, kind, name, description, appearanceDescription, voiceDescription]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [character, scene, prop] }
        name: { type: string }
        description: { type: string }
        sourceBatch:
          description: 首次提取该资产的批次，无法追溯时为空。
          anyOf: [{ $ref: '#/components/schemas/DramaBatchReference' }, { type: 'null' }]
        usedInBatches: { type: array, items: { $ref: '#/components/schemas/DramaBatchReference' }, description: 实际在剧集内引用该资产的批次，按ID去重。 }
        appearanceDescription: { type: string, description: 角色外貌与服饰描述，非角色为空字符串。 }
        voiceDescription: { type: string, description: 角色音色与说话特征描述，非角色为空字符串。 }
    DramaEpisodeAsset:
      allOf:
        - { $ref: '#/components/schemas/DramaCatalogAsset' }
        - type: object
          required: [assetId, stateLabel]
          properties:
            id: { type: string, format: uuid, description: 本集资产关联记录标识，用于移除关联。 }
            assetId: { type: string, format: uuid, description: 项目真实资产主键，与资产目录中的 id 相同。 }
            stateLabel: { type: string, description: 本集状态说明，不参与资产身份判定；多种说明以换行保留。 }
    DramaScriptEpisode:
      type: object
      required: [id, number, title, synopsis, scriptText, characters, scenes, props]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        synopsis: { type: string }
        scriptText: { type: string }
        characters: { type: array, items: { $ref: '#/components/schemas/DramaEpisodeAsset' } }
        scenes: { type: array, items: { $ref: '#/components/schemas/DramaEpisodeAsset' } }
        props: { type: array, items: { $ref: '#/components/schemas/DramaEpisodeAsset' } }
    DramaVideoEpisode:
      type: object
      required: [scriptEpisodeId, projectId, number, batchEpisodeNumber, batch, title, synopsis, storyboardStatus, characterCount, sceneCount, propCount, scriptNeedsReview, scriptUpdatedAt]
      properties:
        scriptEpisodeId: { type: string, format: uuid, description: 原分集剧本主键，也是制作入口的稳定标识。 }
        projectId: { type: string, format: uuid }
        number: { type: integer, minimum: 1, description: 按来源批次和批次内集号排序后的项目内展示序号，不作为身份标识。 }
        batchEpisodeNumber: { type: integer, minimum: 1, description: 原批次内集号。 }
        batch: { $ref: '#/components/schemas/DramaBatchReference' }
        title: { type: string }
        synopsis: { type: string }
        storyboardStatus: { type: string, enum: [pending, queued, running, failed, ready, confirmed, partial, stale], description: 最近一次真实分镜运行状态，剧本变化时标记需重新核对。 }
        characterCount: { type: integer, minimum: 0 }
        sceneCount: { type: integer, minimum: 0 }
        propCount: { type: integer, minimum: 0 }
        scriptNeedsReview: { type: boolean, description: 来源批次范围变更、正在重新解析或解析异常时，保留已有剧本入口并提示核对。 }
        scriptUpdatedAt: { type: string, format: date-time }
    DramaVideoEpisodeWorkspace:
      type: object
      required: [episode, scriptText, characters, scenes, props]
      properties:
        episode: { $ref: '#/components/schemas/DramaVideoEpisode' }
        scriptText: { type: string }
        characters: { type: array, items: { $ref: '#/components/schemas/DramaEpisodeAsset' } }
        scenes: { type: array, items: { $ref: '#/components/schemas/DramaEpisodeAsset' } }
        props: { type: array, items: { $ref: '#/components/schemas/DramaEpisodeAsset' } }
    DramaRepairTicket:
      type: object
      description: 中心调度实际派工和复核记录，非模型思考。单项最多8次、全运行40次；相同问题和状态连续3次无进展时暂停，续跑不会清空计数。
      required: [id, kind, item, reporter, problem, node, targetItem, reason, instructions, returnTo, status, outcome, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [storyboard, batch] }
        item: { type: integer, minimum: 0 }
        reporter: { type: string }
        problem: { type: string }
        node: { type: string, enum: [timing, writer, planner, previous, reviewer, pacing, script_patch, script_director, pause] }
        targetItem: { type: integer, minimum: 0 }
        reason: { type: string }
        instructions: { type: string }
        returnTo: { type: string }
        status: { type: string, enum: [assigned, resolved, feedback, blocked, declined] }
        beforeShotCount: { type: integer, minimum: 1, description: 节奏优化前实际镜头数 }
        afterShotCount: { type: integer, minimum: 1, description: 实际保存的镜头数，未采纳时与原稿相同 }
        beforeDuration: { type: number, exclusiveMinimum: 0, description: 优化前实际规划总秒数 }
        afterDuration: { type: number, exclusiveMinimum: 0, description: 实际保存的规划总秒数，未采纳时与原稿相同 }
        outcome: { type: string }
        createdAt: { type: string, format: date-time }
    DramaStoryboardMention:
      type: object
      required: [start, end, formId]
      description: 文字中的真实形象引用。位置按Unicode字符计数，左闭右开；按位置排序，不得重叠。只允许本项目目录中的形象，保存时加入分镜绑定。
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
        formId: { type: string, format: uuid }
    DramaStoryboardUtterance:
      type: object
      required: [kind, speaker, text, sourceLine]
      properties:
        mentions: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DramaStoryboardMention' } }
        speakerMentions: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DramaStoryboardMention' } }
        kind: { type: string, enum: [dialogue, os, vo] }
        speaker: { type: string }
        text: { type: string, description: 实际口播；delivery为visual时必须为空，其余情况必须非空。 }
        sourceLine: { type: integer, minimum: 1 }
        sourceText: { type: string, description: 旁白精简或转画面前的真实原句。节奏优化时由程序保留，不能借此修改角色对白或心声。 }
        delivery: { type: string, enum: [spoken, visual], default: spoken, description: 省略或spoken为口播；visual仅用于有原句依据的解释性旁白转画面，不计入口播时长。 }
        adaptationReason: { type: string, description: 冗余旁白精简或转画面的说明。 }
    DramaStoryboardShot:
      type: object
      required: [id, number, description, shotSize, camera, sound, duration, sourceLines, utterances]
      properties:
        descriptionMentions: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DramaStoryboardMention' } }
        soundMentions: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DramaStoryboardMention' } }
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        description: { type: string, minLength: 1 }
        shotSize: { type: string }
        camera: { type: string }
        sound: { type: string }
        duration: { type: number, minimum: 0.5, maximum: 60, description: 规划时长，生成前需校验实际模型档位。 }
        sourceLines: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
        utterances: { type: array, items: { $ref: '#/components/schemas/DramaStoryboardUtterance' } }
    DramaStoryboardSegment:
      type: object
      required: [id, number, title, scene, purpose, startLine, endLine, startState, endState, status, notes, formIds, bindings, shots]
      properties:
