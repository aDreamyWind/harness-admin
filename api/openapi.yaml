    CreateModelProviderRequest:
      type: object
      required: [code, name, baseUrl, apiKey]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        providerKind:
          type: string
          enum: [openai_compatible, deepseek, aliyun_bailian, kimi, ollama, siliconflow, claude, gemini]
          default: openai_compatible
          description: 供应商协议预设；Claude 和 Gemini 当前仅支持模型发现与目录收录。
        baseUrl: { type: string, format: uri }
        modelListUrl: { type: string, description: 独立的模型目录接口完整地址；为空时按供应商协议推导。百炼可填写对应地域业务空间的 /api/v1/models 地址。 }
        apiKey: { type: string, format: password, minLength: 1, maxLength: 4096, writeOnly: true }
        requestTimeoutMs: { type: integer, minimum: 1000, maximum: 120000, default: 15000 }
        streamUsageEnabled:
          type: boolean
          default: false
          description: 启用后仅在流式聊天请求中发送 stream_options.include_usage=true；请先确认上游兼容，网关不会对拒绝的请求自动重试。上游仍未返回 usage 时用量保持未知。
    UpdateModelProviderRequest:
      type: object
      required: [name, providerKind, baseUrl, requestTimeoutMs]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        providerKind:
          type: string
          enum: [openai_compatible, deepseek, aliyun_bailian, kimi, ollama, siliconflow, claude, gemini]
          description: 供应商协议预设；Claude 和 Gemini 当前仅支持模型发现与目录收录。
        baseUrl: { type: string, format: uri }
        modelListUrl: { type: string, description: 省略时保留当前目录地址；传空字符串时恢复按供应商协议推导。 }
        apiKey:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: 省略时保留当前凭据。
        requestTimeoutMs: { type: integer, minimum: 1000, maximum: 120000 }
        streamUsageEnabled:
          type: boolean
          description: 是否在流式聊天请求中向上游请求 Token 用量；省略时保持当前设置。
    StatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    OIDCClientWriteRequest:
      type: object
      required: [name, redirectUris, allowedScopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        applicationType:
          type: string
          enum: [web, desktop]
          default: web
          description: 创建时指定应用类型；更新时不可变更。desktop 为无密钥的公开客户端。
        redirectUris:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: 服务端应用精确匹配；桌面应用的 IP 回环地址忽略端口匹配；非回环地址必须使用 HTTPS。
          items: { type: string, format: uri, maxLength: 2048 }
        allowedScopes:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: 必须包含 openid。
          items: { type: string, enum: [openid, profile, email, model.invoke, mcp.invoke, offline_access] }
    OIDCClient:
      type: object
      required: [id, name, clientId, clientSecretPrefix, applicationType, tokenEndpointAuthMethod, redirectUris, allowedScopes, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clientId: { type: string, description: 对外公开的 OAuth 客户端标识。 }
        clientSecretPrefix: { type: string, description: 可安全展示的客户端密钥前缀。 }
        applicationType: { type: string, enum: [web, desktop] }
        tokenEndpointAuthMethod: { type: string, enum: [client_secret_basic, none] }
        redirectUris:
          type: array
          items: { type: string, format: uri }
        allowedScopes:
          type: array
          items: { type: string, enum: [openid, profile, email, model.invoke, mcp.invoke, offline_access] }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatedOIDCClient:
      allOf:
