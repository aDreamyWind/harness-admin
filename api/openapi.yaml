            application/json:
              schema: { $ref: '#/components/schemas/MCPDeploymentVersionListEnvelope' }
  /mcp-deployments/{serviceId}/versions/repository:
    post:
      summary: 从 GitHub 或 Gitee 仓库为托管 MCP 构建新版本
      operationId: buildMCPRepositoryVersion
      security: [{ sessionCookie: [], csrfHeader: [] }]
