        departmentName: { type: string }
        calls: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        averageMs: { type: integer, format: int64 }
    MCPUserConnection:
      type: object
      required: [code, name, serviceName, url, transport]
      properties:
        code: { type: string }
        name: { type: string }
        serviceName: { type: string }
