openapi: 3.1.0
info:
  title: Harness Admin API
  version: 0.22.0
  description: Harness 企业控制面 HTTP API。
servers:
  - url: /api/v1
paths:
  /platform/auth/login:
    post:
      summary: 平台管理员登录
      operationId: platformLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformLoginRequest' }
      responses:
        '200':
          description: 平台管理员登录成功，写入独立平台会话与 CSRF Cookie。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformLoginEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: 登录失败次数过多。 }
  /platform/auth/me:
    get:
      summary: 获取当前平台管理员
      operationId: getCurrentPlatformAdmin
      security:
        - platformSessionCookie: []
      responses:
        '200':
          description: 当前平台管理员。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdminEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /platform/auth/logout:
    post:
      summary: 退出平台管理
      operationId: platformLogout
      security:
        - platformSessionCookie: []
          csrfHeader: []
      responses:
        '200': { description: 平台会话已吊销。 }
  /platform/organizations:
    get:
      summary: 查询全部企业
      operationId: listPlatformOrganizations
      security:
        - platformSessionCookie: []
      responses:
        '200':
          description: 企业列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOrganizationListEnvelope' }
    post:
      summary: 创建企业及首位企业管理员
      operationId: createPlatformOrganization
      security:
        - platformSessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlatformOrganizationRequest' }
      responses:
        '201':
          description: 企业、企业管理员角色和首位管理员已在同一事务中创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOrganizationEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 企业编码已存在。 }
  /platform/organizations/{organizationId}/status:
    put:
      summary: 修改企业状态
      operationId: updatePlatformOrganizationStatus
      security:
        - platformSessionCookie: []
          csrfHeader: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlatformOrganizationStatusRequest' }
      responses:
        '200':
          description: 企业状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOrganizationEnvelope' }
        '404': { description: 企业不存在。 }
  /auth/organizations:
    get:
      summary: 查询可登录企业
      description: 登录页公开读取启用中的企业名称与企业编码。
      operationId: listLoginOrganizations
      responses:
        '200':
          description: 可登录企业列表，按创建时间排序。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOrganizationListEnvelope'
  /auth/login:
    post:
      summary: 登录管理端
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，同时写入会话与 CSRF Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: 账号因连续登录失败已被锁定，需要管理员解锁。
        '429':
          description: 登录失败次数过多。
  /auth/me:
    get:
      summary: 获取当前登录用户
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: 退出登录
      operationId: logout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 会话已吊销。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/password:
    put:
      summary: 修改当前账号密码
      description: 修改成功后保留当前会话，并吊销当前账号的其他会话。
      operationId: changeCurrentPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码已修改。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeEnvelope'
        '400':
          description: 密码参数不正确或当前密码错误。
        '409':
          description: 新密码与当前密码相同。
  /auth/profile:
    put:
      summary: 修改当前账号资料
      description: 修改当前登录用户的显示名称和邮箱，登录用户名不可修改。
      operationId: updateCurrentUserProfile
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 个人资料已更新。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 邮箱已被当前企业内其他用户使用。
  /auth/sessions:
    get:
      summary: 查询当前账号的活跃会话
      operationId: listCurrentUserSessions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 未过期且未吊销的会话，当前会话优先返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionListEnvelope'
  /auth/sessions/{sessionId}:
    delete:
      summary: 吊销指定会话
      description: 只能吊销当前账号名下的非当前会话。
      operationId: revokeCurrentUserSession
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 会话已吊销。
        '404':
          description: 会话不存在或已经失效。
        '409':
          description: 不能通过会话管理吊销当前会话。
  /auth/sessions/revoke-others:
    post:
      summary: 吊销当前账号的其他会话
      operationId: revokeOtherCurrentUserSessions
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 其他会话已吊销，当前会话保持登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevocationEnvelope'
  /users:
    get:
      summary: 查询当前企业用户
      operationId: listUsers
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, locked, disabled]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页用户列表，需要 `iam.user.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 创建用户
      operationId: createUser
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 用户创建成功，需要 `iam.user.write` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 用户名或邮箱已存在。
  /users/{userId}:
    put:
      summary: 修改用户资料
      description: 修改显示名称和邮箱；登录用户名创建后不可修改。需要 `iam.user.write` 权限。
      operationId: updateUser
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 用户资料修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户不存在。
        '409':
          description: 邮箱已被当前企业内其他用户使用。
  /users/{userId}/status:
    patch:
      summary: 修改用户状态
      operationId: changeUserStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: 状态修改成功；停用时会吊销该用户全部会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '404':
          description: 用户不存在。
        '409':
          description: 不能停用当前登录账号；锁定用户必须使用解锁接口。
  /users/{userId}/password:
    put:
      summary: 重置用户密码
      description: 重置成功后吊销目标用户的全部会话；不能通过该接口重置当前登录账号。
      operationId: resetUserPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 密码已重置，需要 `iam.user.write` 权限。
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户不存在。
        '409':
          description: 不能重置当前登录账号的密码。
  /users/{userId}/unlock:
    post:
      summary: 解锁用户
      description: 清除目标账号的登录失败计数并恢复为正常状态，需要 `iam.user.write` 权限。
      operationId: unlockUser
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 用户已解锁，可以重新登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '404':
          description: 用户不存在。
        '409':
          description: 用户当前未被锁定。
  /users/{userId}/roles:
    put:
      summary: 设置用户角色
      operationId: assignUserRoles
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: 用户角色已更新，需要 `iam.user.write` 权限。
        '404':
          description: 用户或角色不存在。
        '409':
          description: 不能修改当前登录账号的角色。
  /users/{userId}/department:
    patch:
      summary: 调整用户所属部门
      operationId: assignUserDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId]
              properties:
                departmentId:
                  type: string
                  description: 部门 UUID；空字符串表示清除部门归属。
      responses:
        '200':
          description: 用户部门已更新，需要 `iam.user.write` 权限。
        '404':
          description: 用户不存在。
  /organization:
    get:
      summary: 获取当前企业资料
      operationId: getOrganization
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前登录用户所属企业，需要 `iam.organization.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: 修改当前企业资料
      description: 仅修改企业展示名称；企业编码作为登录和数据隔离标识不可修改。需要 `iam.organization.write` 权限。
      operationId: updateOrganization
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: 企业资料修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 企业不存在。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /departments:
    get:
      summary: 查询当前企业部门
      operationId: listDepartments
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 部门平铺列表，通过 parentId 表达层级，需要 `iam.department.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentListEnvelope' }
    post:
      summary: 创建部门
      operationId: createDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartmentRequest' }
      responses:
        '201':
          description: 部门创建成功，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 部门代码已存在。
  /departments/{departmentId}:
    put:
      summary: 修改部门
      operationId: updateDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDepartmentRequest' }
      responses:
        '200':
          description: 部门已更新，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 不能移动到自身或下级部门。
  /departments/{departmentId}/status:
    patch:
      summary: 修改部门状态
      operationId: changeDepartmentStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 部门状态已更新，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 部门下仍有启用中的子部门或用户。
  /roles:
    get:
      summary: 查询当前企业角色
      operationId: listRoles
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 角色列表，需要 `iam.role.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListEnvelope'
    post:
      summary: 创建角色
      operationId: createRole
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: 角色创建成功，需要 `iam.role.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '409':
          description: 角色代码已存在。
  /roles/{roleId}:
    put:
      summary: 修改自定义角色
      operationId: updateRole
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: 角色已更新，需要 `iam.role.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '409':
          description: 系统内置角色不允许修改。
  /permissions:
    get:
      summary: 查询系统权限定义
      operationId: listPermissions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 权限列表，需要 `iam.role.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionListEnvelope' }
  /audit-events:
    get:
      summary: 查询当前企业审计事件
      operationId: listAuditEvents
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: 模糊匹配动作、资源、请求 ID 或操作人。
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, denied, failed] }
        - name: startedAt
          in: query
          schema: { type: string, format: date-time }
        - name: endedAt
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页审计事件列表，需要 `audit.event.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventListEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-events/{eventId}:
    get:
      summary: 查询审计事件详情
      operationId: getAuditEvent
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: 当前企业内的审计事件详情，需要 `audit.event.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventEnvelope' }
        '404':
          description: 审计事件不存在或不属于当前企业。
  /oidc/clients:
    get:
      summary: 查询当前企业的统一登录应用
      operationId: listOIDCClients
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 应用列表，不返回完整客户端密钥，需要 `oidc.client.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建统一登录应用
      description: 桌面应用是公开客户端，不生成密钥；服务端应用同时保存用于认证的 SHA-256 哈希和使用主密钥加密的密文，具备管理权限时可再次查看。
      operationId: createOIDCClient
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCClientWriteRequest' }
      responses:
        '201':
          description: 应用已创建；服务端应用的响应包含客户端密钥，后续也可通过密钥查看接口读取。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOIDCClientEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /oidc/clients/{oidcClientId}:
    put:
      summary: 修改统一登录应用
      operationId: updateOIDCClient
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          description: 应用记录标识，不是对外的 client_id。
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCClientWriteRequest' }
      responses:
        '200':
          description: 应用设置已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
  /oidc/clients/{oidcClientId}/status:
    patch:
      summary: 修改统一登录应用状态
      operationId: changeOIDCClientStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 应用状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCClientEnvelope' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
  /oidc/clients/{oidcClientId}/rotate-secret:
    post:
      summary: 轮换统一登录应用的客户端密钥
      operationId: rotateOIDCClientSecret
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 密钥已轮换，旧密钥立即失效，响应包含新密钥且后续可再次查看。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOIDCClientEnvelope' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
        '409': { description: 桌面应用不使用客户端密钥。 }
  /oidc/clients/{oidcClientId}/secret:
    get:
      summary: 查看统一登录应用的客户端密钥
      description: 需要 `oidc.client.write` 权限；每次成功查看都会写入审计日志，响应禁止缓存。历史未保存密文的应用需先轮换密钥。
      operationId: revealOIDCClientSecret
      security:
        - sessionCookie: []
      parameters:
        - name: oidcClientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 返回解密后的完整客户端密钥。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretEnvelope' }
        '404': { description: 统一登录应用不存在或不属于当前企业。 }
        '409': { description: 桌面应用不使用密钥，或历史密钥没有可解密密文。 }
  /.well-known/openid-configuration:
    servers:
      - url: /
    get:
      summary: 获取 OpenID Connect 发现文档
      operationId: getOIDCDiscovery
      responses:
        '200':
          description: OIDC Provider 元数据。
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /oauth2/jwks:
    get:
      summary: 获取 OIDC RSA 公钥集
      operationId: getOIDCJWKS
      responses:
        '200':
          description: 用于校验 RS256 身份令牌和访问令牌的 JSON Web Key Set。
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /oauth2/authorize:
    get:
      summary: 发起 OIDC 授权码登录
      description: 要求当前 Harness Admin 用户会话有效，并强制使用 PKCE S256。未登录时跳转到管理端登录页；用户尚未同意或应用新增权限时跳转到授权确认页。桌面应用登记 IP 回环地址时，实际授权请求可使用随机端口。
      operationId: authorizeOIDC
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string, maxLength: 255 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      responses:
        '302': { description: 跳转到登录页、授权确认页或客户端登记的回调地址。 }
        '400':
          description: 授权请求不正确。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /oauth2/consent:
    get:
      summary: 读取当前 OIDC 授权请求
      description: 在授权确认页展示前重新校验应用、回调地址、PKCE 和申请范围。
      operationId: getOIDCConsentRequest
      security:
        - sessionCookie: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string, maxLength: 255 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      responses:
        '200':
          description: 已校验的应用和申请权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCAuthorizationRequestEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: 同意或拒绝 OIDC 应用授权
      operationId: decideOIDCConsent
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string, maxLength: 255 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCConsentDecision' }
      responses:
        '200':
          description: 返回客户端回调地址；拒绝时回调包含 access_denied。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCConsentResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /account/authorized-applications:
    get:
      summary: 查询当前用户已授权应用
      operationId: listCurrentUserAuthorizedApplications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户尚未撤销的应用授权。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizedApplicationListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /account/authorized-applications/{consentId}:
    delete:
      summary: 撤销当前用户的应用授权
      description: 撤销授权并立即使该应用的未兑换授权码和现有刷新令牌失效；已经签发的访问令牌仍按原有效期到期。
      operationId: revokeCurrentUserAuthorizedApplication
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: consentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 应用授权已撤销。 }
        '404': { description: 应用授权不存在或已经撤销。 }
  /oauth2/token:
    post:
      summary: 兑换或刷新 OIDC 令牌
      operationId: exchangeOIDCToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OIDCTokenRequest'
      responses:
        '200':
          description: 令牌签发成功；刷新令牌仅在授权包含 offline_access 时返回。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCTokenResponse' }
        '400':
          description: 授权码、PKCE 或刷新令牌无效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: 客户端认证失败。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /oauth2/userinfo:
    get:
      summary: 获取 OIDC 当前用户资料
      operationId: getOIDCUserInfo
      security:
        - oidcBearer: []
      responses:
        '200':
          description: 返回内容按令牌 scope 过滤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCUserInfo' }
        '401':
          description: Bearer 访问令牌无效或已过期。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /model-providers:
    get:
      summary: 查询当前企业的模型供应商连接
      operationId: listModelProviders
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 供应商连接列表，需要 `model.provider.read` 权限；响应不包含访问凭据。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建模型供应商连接
      operationId: createModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelProviderRequest' }
      responses:
        '201':
          description: 供应商连接已创建，API Key 已加密保存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 企业内供应商连接编码已存在。 }
  /model-providers/{providerId}:
    put:
      summary: 修改模型供应商连接
      description: "apiKey 省略时保留当前凭据；提供时替换加密凭据。"
      operationId: updateModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelProviderRequest' }
      responses:
        '200':
          description: 供应商连接已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
        '404': { description: 供应商连接不存在。 }
  /model-providers/{providerId}/status:
    patch:
      summary: 修改模型供应商连接状态
      operationId: changeModelProviderStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 供应商连接状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderEnvelope' }
  /model-providers/{providerId}/probe:
    post:
      summary: 检测模型供应商连接
      description: 使用加密保存的凭据读取上游模型列表，不发送业务数据。
      operationId: probeModelProvider
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 连接检测成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProviderProbeEnvelope' }
        '409': { description: 供应商连接已停用。 }
        '502': { description: 无法连接供应商，或供应商拒绝凭据。 }
  /model-providers/{providerId}/credential:
    get:
      summary: 查看模型供应商 API Key
      description: 需要 `model.provider.write` 权限；每次成功查看都会写入审计日志，响应禁止缓存。
      operationId: revealModelProviderCredential
      security:
        - sessionCookie: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 返回解密后的完整 API Key。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretEnvelope' }
        '404': { description: 供应商连接不存在或不属于当前企业。 }
  /models:
    get:
      summary: 查询当前企业的模型目录
      operationId: listModels
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 模型目录列表，需要 `model.catalog.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogListEnvelope' }
    post:
      summary: 创建模型目录项
      operationId: createModel
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelRequest' }
      responses:
        '201':
          description: 模型目录项已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
        '409': { description: 模型编码或供应商侧模型标识已存在。 }
  /models/{modelId}:
    put:
      summary: 修改模型目录项
      operationId: updateModel
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelRequest' }
      responses:
        '200':
          description: 模型目录项已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
        '404': { description: 模型或供应商连接不存在。 }
  /models/{modelId}/status:
    patch:
      summary: 修改模型状态
      operationId: changeModelStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: 模型状态已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalogEnvelope' }
  /model-policies:
    get:
      summary: 查询部门和用户的模型策略
      operationId: listModelPolicies
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前企业的模型策略及本月用量，需要 `model.policy.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPolicyListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-policies/departments:
    put:
      summary: 批量设置部门模型策略
      description: 在一个事务中为所列部门分别设置相同策略，各部门的共享额度池独立。只对请求中明确列出的部门生效，不自动覆盖现有或今后新增的下级部门。需要 `model.policy.write` 权限。
      operationId: saveDepartmentModelPolicies
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDepartmentModelPoliciesRequest' }
      responses:
        '200':
          description: 所选部门的策略已原子保存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPolicyListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 一个或多个部门不属于当前企业。 }
  /model-policies/{subjectType}/{subjectId}:
    parameters:
      - name: subjectType
        in: path
        required: true
        schema: { type: string, enum: [department, user] }
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: 设置部门或用户的模型策略
      description: 用户模型范围可覆盖其所属部门的模型范围；所属部门及用户的月度额度同时生效，上级部门策略不穿透。每分钟请求上限始终按用户独立计算。需要 `model.policy.write` 权限。
      operationId: saveModelPolicy
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveModelPolicyRequest' }
      responses:
        '200':
          description: 策略已保存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPolicyEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 部门或用户不属于当前企业。 }
    delete:
      summary: 删除部门或用户的模型策略
      description: 删除策略后恢复默认规则；对应的月度策略用量一并删除。需要 `model.policy.write` 权限。
      operationId: deleteModelPolicy
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': { description: 策略已删除。 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 策略不存在。 }
  /model-gateway/api-keys:
    get:
      summary: 查询当前企业的模型网关调用密钥
      operationId: listModelGatewayAPIKeys
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 调用密钥列表，仅返回非敏感前缀，需要 `model.gateway.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 创建模型网关调用密钥
      description: 服务端同时保存用于认证的 SHA-256 哈希和使用主密钥加密的密文，具备管理权限时可再次查看。
      operationId: createModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGatewayAPIKeyRequest' }
      responses:
        '201':
          description: 调用密钥已创建，响应包含完整密钥，后续也可通过密钥查看接口读取。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedGatewayAPIKeyEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /model-gateway/api-keys/{apiKeyId}/revoke:
    patch:
      summary: 吊销模型网关调用密钥
      operationId: revokeModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 调用密钥已吊销，立即停止接受新调用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyEnvelope' }
        '404': { description: 调用密钥不存在或不属于当前企业。 }
  /model-gateway/api-keys/{apiKeyId}:
    put:
      summary: 修改模型网关调用密钥
      description: 修改名称、过期时间、限流、月度 Token 额度和可用模型范围，不更换密钥值。
      operationId: updateModelGatewayAPIKey
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGatewayAPIKeyRequest' }
      responses:
        '200':
          description: 调用密钥设置已更新。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAPIKeyEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 调用密钥不存在或不属于当前企业。 }
  /model-gateway/api-keys/{apiKeyId}/secret:
    get:
      summary: 查看模型网关调用密钥
      description: 需要 `model.gateway.write` 权限；每次成功查看都会写入审计日志，响应禁止缓存。历史未保存密文的密钥需重新创建。
      operationId: revealModelGatewayAPIKeySecret
      security:
        - sessionCookie: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 返回解密后的完整调用密钥。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretEnvelope' }
        '404': { description: 调用密钥不存在或不属于当前企业。 }
        '409': { description: 历史调用密钥没有可解密密文，需要重新创建。 }
  /model-gateway/calls:
    get:
      summary: 查询当前企业的模型网关调用记录
      description: 不保存提示词与模型回答，支持按调用密钥、模型编码、结果和时间范围查询。
      operationId: listModelGatewayCalls
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: apiKeyId
          in: query
          schema: { type: string, format: uuid }
        - name: modelCode
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, failed] }
        - name: startedAt
          in: query
          schema: { type: string, format: date-time }
        - name: endedAt
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 网关调用记录，需要 `model.gateway.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayCallPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-gateway/usage:
    get:
      summary: 查询模型网关月度用量
      description: 按 UTC 自然月汇总；部门和用户维度只包含 OIDC 用户调用，模型维度包含用户和调用密钥。缺少上游 usage 的调用计为用量未知，不当作零 Token。需要 `model.gateway.read` 权限。
      operationId: listModelGatewayUsage
      security:
        - sessionCookie: []
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: UTC 月份，格式 YYYY-MM；省略时为当前 UTC 月。
        - name: groupBy
          in: query
          schema: { type: string, enum: [department, user, model], default: department }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 月度用量分页汇总。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayUsagePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-gateway/alerts:
    get:
      summary: 查询并刷新模型网关站内预警
      description: 查询当前 UTC 月时按实时已统计用量刷新记录，并按企业、月份和对象去重；历史月份只读取记录。额度达到 80% 预警、达到 100% 紧急。模型成功调用至少 5 次用量未知且占比至少 20% 时预警。部门按人额度逐人判断，不把部门合计与个人上限比较。需要 `model.gateway.read` 权限。
      operationId: listModelGatewayAlerts
      security:
        - sessionCookie: []
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: UTC 月份，格式 YYYY-MM；省略时为当前 UTC 月。
        - name: status
          in: query
          schema: { type: string, enum: [active, all], default: active }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 预警记录及当前有效预警总数。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAlertPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-gateway/alerts/{id}/acknowledge:
    post:
      summary: 标记模型网关预警为已知悉
      description: 仅可确认本企业尚未解除的预警；严重程度从提醒升级为紧急或解除后重新出现时，会清除确认状态。需要 `model.gateway.write` 权限和 CSRF 校验。
      operationId: acknowledgeModelGatewayAlert
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已知悉的预警。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayAlertEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/models:
    servers:
      - url: /
    get:
      summary: OpenAI 兼容可用模型目录
      description: 使用网关调用密钥或带 `model.invoke` scope 的 OIDC 用户令牌；只返回当前身份有权使用且模型与供应商均已启用的模型。
      operationId: listGatewayModels
      security:
        - gatewayBearer: []
        - oidcBearer: []
      responses:
        '200':
          description: OpenAI 兼容模型列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIModelList' }
        '401': { description: 调用身份无效、已吊销或已过期。 }
  /v1/chat/completions:
    servers:
      - url: /
    post:
      summary: OpenAI 兼容聊天补全入口
      description: 使用企业模型编码选择已启用且当前身份有权调用的模型，支持流式与非流式响应透传。可使用网关调用密钥，或包含 `model.invoke` scope 的 OIDC 用户访问令牌。用户调用还受部门共享及个人请求上限、月度额度约束。
      operationId: gatewayChatCompletions
      security:
        - gatewayBearer: []
        - oidcBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string, description: 企业模型目录中的模型编码。 }
                messages:
                  type: array
                  items: { type: object, additionalProperties: true }
                stream: { type: boolean, default: false }
              additionalProperties: true
      responses:
        '200':
          description: 上游 OpenAI 兼容响应，流式调用返回 `text/event-stream`。
        '400': { description: 请求格式不正确。 }
        '401': { description: 调用密钥无效、已吊销或已过期。 }
        '403': { description: 当前调用身份无权访问请求的模型。 }
        '404': { description: 模型编码不存在。 }
        '409': { description: 模型或供应商连接已停用。 }
        '429': { description: 超过调用身份、部门或用户的每分钟请求限制，或当月 Token 额度已用尽。 }
        '502': { description: 无法连接模型供应商。 }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: harness_admin_session
    platformSessionCookie:
      type: apiKey
      in: cookie
      name: harness_platform_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    gatewayBearer:
      type: http
      scheme: bearer
      bearerFormat: Harness gateway key
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 请求参数不正确。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或会话已失效。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 权限不足或 CSRF 校验失败。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 请求的资源不存在。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    PlatformLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 80 }
        password: { type: string, format: password, maxLength: 1024 }
    PlatformAdmin:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
    PlatformOrganization:
      type: object
      required: [id, code, name, status, adminUsername, userCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        adminUsername: { type: string }
        userCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePlatformOrganizationRequest:
      type: object
      required: [code, name, adminUsername, adminDisplayName, adminPassword]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        adminUsername: { type: string, minLength: 1, maxLength: 80 }
        adminDisplayName: { type: string, minLength: 1, maxLength: 120 }
        adminEmail: { type: string, description: 可为空字符串。 }
        adminPassword: { type: string, format: password, minLength: 3, maxLength: 1024 }
    UpdatePlatformOrganizationStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    LoginRequest:
      type: object
      required: [organizationCode, username, password]
      properties:
        organizationCode: { type: string }
        username: { type: string }
        password: { type: string, format: password }
    LoginOrganization:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    CreateUserRequest:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 80 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        departmentId: { type: string, format: uuid }
        password: { type: string, format: password, minLength: 3 }
    UpdateUserRequest:
      type: object
      required: [displayName, email]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email:
          type: string
          description: 电子邮箱；空字符串表示清除邮箱。
    UpdateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 3, maxLength: 1024 }
    UpdateProfileRequest:
      type: object
      required: [displayName, email]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email:
          type: string
          description: 电子邮箱；空字符串表示清除邮箱。
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 3, maxLength: 1024 }
    CreateRoleRequest:
      type: object
      required: [code, name, permissionCodes]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        permissionCodes:
          type: array
          items: { type: string }
    UpdateRoleRequest:
      type: object
      required: [name, permissionCodes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        permissionCodes:
          type: array
          items: { type: string }
    CreateDepartmentRequest:
      type: object
      required: [code, name, sortOrder]
      properties:
        parentId: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
    UpdateDepartmentRequest:
      type: object
      required: [name, sortOrder]
      properties:
        parentId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
    CreateModelProviderRequest:
      type: object
      required: [code, name, baseUrl, apiKey]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        providerKind:
          type: string
          enum: [openai_compatible, deepseek, aliyun_bailian, kimi, ollama]
          default: openai_compatible
          description: 供应商协议预设；当前均通过 OpenAI 兼容接口接入。
        baseUrl: { type: string, format: uri }
        apiKey: { type: string, format: password, minLength: 1, maxLength: 4096, writeOnly: true }
        requestTimeoutMs: { type: integer, minimum: 1000, maximum: 120000, default: 15000 }
        streamUsageEnabled:
          type: boolean
          default: false
          description: 启用后仅在流式聊天请求中发送 stream_options.include_usage=true；请先确认上游兼容，网关不会对拒绝的请求自动重试。上游仍未返回 usage 时用量保持未知。
    UpdateModelProviderRequest:
      type: object
      required: [name, providerKind, baseUrl, requestTimeoutMs]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        providerKind:
          type: string
          enum: [openai_compatible, deepseek, aliyun_bailian, kimi, ollama]
          description: 供应商协议预设；当前均通过 OpenAI 兼容接口接入。
        baseUrl: { type: string, format: uri }
        apiKey:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: 省略时保留当前凭据。
        requestTimeoutMs: { type: integer, minimum: 1000, maximum: 120000 }
        streamUsageEnabled:
          type: boolean
          description: 是否在流式聊天请求中向上游请求 Token 用量；省略时保持当前设置。
    StatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    OIDCClientWriteRequest:
      type: object
      required: [name, redirectUris, allowedScopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        applicationType:
          type: string
          enum: [web, desktop]
          default: web
          description: 创建时指定应用类型；更新时不可变更。desktop 为无密钥的公开客户端。
        redirectUris:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: 服务端应用精确匹配；桌面应用的 IP 回环地址忽略端口匹配；非回环地址必须使用 HTTPS。
          items: { type: string, format: uri, maxLength: 2048 }
        allowedScopes:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: 必须包含 openid。
          items: { type: string, enum: [openid, profile, email, model.invoke, offline_access] }
    OIDCClient:
      type: object
      required: [id, name, clientId, clientSecretPrefix, applicationType, tokenEndpointAuthMethod, redirectUris, allowedScopes, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clientId: { type: string, description: 对外公开的 OAuth 客户端标识。 }
        clientSecretPrefix: { type: string, description: 可安全展示的客户端密钥前缀。 }
        applicationType: { type: string, enum: [web, desktop] }
        tokenEndpointAuthMethod: { type: string, enum: [client_secret_basic, none] }
        redirectUris:
          type: array
          items: { type: string, format: uri }
        allowedScopes:
          type: array
          items: { type: string, enum: [openid, profile, email, model.invoke, offline_access] }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatedOIDCClient:
      allOf:
        - $ref: '#/components/schemas/OIDCClient'
        - type: object
          properties:
            clientSecret: { type: string, readOnly: true, description: 服务端应用在创建或轮换成功时返回；桌面应用不返回。后续可通过密钥查看接口再次读取。 }
    OIDCTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string, description: 桌面应用必须在表单中传递；服务端应用也可通过 HTTP Basic 用户名传递。 }
        client_secret: { type: string, format: password, description: 仅服务端应用需要，也可通过 HTTP Basic 密码传递。 }
        code: { type: string }
        redirect_uri: { type: string, format: uri }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        refresh_token: { type: string }
    OIDCAuthorizationRequest:
      type: object
      required: [clientName, clientId, applicationType, redirectUri, redirectHost, scopes]
      properties:
        clientName: { type: string }
        clientId: { type: string }
        applicationType: { type: string, enum: [web, desktop] }
        redirectUri: { type: string, format: uri }
        redirectHost: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [openid, profile, email, model.invoke, offline_access] }
    OIDCConsentDecision:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
    OIDCConsentResult:
      type: object
      required: [redirectUri]
      properties:
        redirectUri: { type: string, format: uri }
    AuthorizedApplication:
      type: object
      required: [id, clientId, clientName, applicationType, scopes, grantedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string }
        clientName: { type: string }
        applicationType: { type: string, enum: [web, desktop] }
        scopes:
          type: array
          items: { type: string, enum: [openid, profile, email, model.invoke, offline_access] }
        grantedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OIDCTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, id_token, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, example: 3600 }
        id_token: { type: string }
        refresh_token: { type: string }
        scope: { type: string }
    OIDCUserInfo:
      type: object
      required: [sub, org_id, org_code]
      properties:
        sub: { type: string, format: uuid }
        name: { type: string }
        preferred_username: { type: string }
        email: { type: string, format: email }
        org_id: { type: string, format: uuid }
        org_code: { type: string }
    OAuthError:
      type: object
      required: [error, error_description]
      properties:
        error: { type: string }
        error_description: { type: string }
    CreateModelRequest:
      type: object
      required: [providerConnectionId, code, upstreamModelId, capabilities]
      properties:
        providerConnectionId: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' }
        upstreamModelId: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 120, description: 省略或留空时使用上游模型标识。 }
        modelType: { type: string, enum: [chat], default: chat }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, vision, tools, streaming, json] }
        contextWindowTokens: { type: integer, minimum: 0, default: 0 }
        maxOutputTokens: { type: integer, minimum: 0, default: 0 }
    UpdateModelRequest:
      description: 模型编码创建后不可修改。
      type: object
      required: [providerConnectionId, upstreamModelId, capabilities]
      properties:
        providerConnectionId: { type: string, format: uuid }
        upstreamModelId: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 120, description: 省略或留空时使用上游模型标识。 }
        modelType: { type: string, enum: [chat], default: chat }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, vision, tools, streaming, json] }
        contextWindowTokens: { type: integer, minimum: 0, default: 0 }
        maxOutputTokens: { type: integer, minimum: 0, default: 0 }
    ModelProvider:
      type: object
      required: [id, code, name, providerKind, baseUrl, status, requestTimeoutMs, streamUsageEnabled, credentialConfigured, lastProbeStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        providerKind: { type: string, enum: [openai_compatible, deepseek, aliyun_bailian, kimi, ollama] }
        baseUrl: { type: string, format: uri }
        status: { type: string, enum: [active, disabled] }
        requestTimeoutMs: { type: integer }
        streamUsageEnabled: { type: boolean, description: 是否向上游请求流式 Token 用量。 }
        credentialConfigured: { type: boolean }
        lastProbeStatus: { type: string, enum: [unknown, success, failed] }
        lastProbeAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModelCatalogEntry:
      type: object
      required: [id, providerConnectionId, providerName, code, upstreamModelId, name, modelType, capabilities, contextWindowTokens, maxOutputTokens, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        providerConnectionId: { type: string, format: uuid }
        providerName: { type: string }
        code: { type: string }
        upstreamModelId: { type: string }
        name: { type: string }
        modelType: { type: string, enum: [chat] }
        capabilities:
          type: array
          items: { type: string, enum: [text, vision, tools, streaming, json] }
        contextWindowTokens: { type: integer }
        maxOutputTokens: { type: integer }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SaveModelPolicyRequest:
      type: object
      required: [scopeMode, requestsPerMinute, monthlyTokenLimit]
      properties:
        scopeMode: { type: string, enum: [inherit, all, selected, none], description: '用户策略 inherit 使用所属部门范围；部门策略不应使用 inherit。selected 必须提供非空模型编码。' }
        allowedModelCodes:
          type: array
          items: { type: string }
        requestsPerMinute: { type: integer, minimum: 0, maximum: 100000, description: '0 表示不限；部门及用户策略均按每名用户独立限流。' }
        monthlyTokenLimit: { type: integer, format: int64, minimum: 0, description: 'UTC 自然月 Token 额度，0 表示不限。' }
        monthlyTokenMode: { type: string, enum: [shared, per_user], default: shared, description: '部门策略选择共享或每名用户独立；用户策略只能使用 shared（其额度本身属于该用户）。' }
    SaveDepartmentModelPoliciesRequest:
      allOf:
        - $ref: '#/components/schemas/SaveModelPolicyRequest'
        - type: object
          required: [subjectIds, monthlyTokenMode]
          properties:
            subjectIds:
              type: array
              minItems: 1
              maxItems: 10000
              uniqueItems: true
              items: { type: string, format: uuid }
    ModelPolicy:
      type: object
      required: [subjectType, subjectId, subjectName, scopeMode, requestsPerMinute, monthlyTokenLimit, monthlyTokenMode, monthlyTokenUsed, createdAt, updatedAt]
      properties:
        subjectType: { type: string, enum: [department, user] }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        scopeMode: { type: string, enum: [inherit, all, selected, none] }
        allowedModelCodes:
          type: array
          nullable: true
          items: { type: string }
        requestsPerMinute: { type: integer }
        monthlyTokenLimit: { type: integer, format: int64 }
        monthlyTokenMode: { type: string, enum: [shared, per_user] }
        monthlyTokenUsed: { type: integer, format: int64, description: '该部门或用户本月已用 Token 合计；部门 per_user 模式下不是单个用户的用量。' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data:
          type: array
          items:
            type: object
            required: [id, object, created, owned_by]
            properties:
              id: { type: string, description: 企业模型编码。 }
              object: { type: string, enum: [model] }
              created: { type: integer, format: int64, description: Unix 秒时间戳。 }
              owned_by: { type: string, enum: [harness-admin] }
              name: { type: string, description: Harness Admin 中配置的模型显示名称。 }
              capabilities:
                type: array
                description: Harness Admin 中配置的模型能力代码。
                items: { type: string }
    CreateGatewayAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        expiresAt: { type: string, format: date-time, description: 省略时永不过期，必须晚于当前时间。 }
        requestsPerMinute: { type: integer, minimum: 0, maximum: 100000, default: 60, description: 0 表示不限制。 }
        monthlyTokenLimit: { type: integer, format: int64, minimum: 0, default: 0, description: UTC 自然月 Token 额度，0 表示不限制。 }
        allowedModelCodes:
          type: array
          description: 允许调用的模型编码；空数组表示所有已启用模型。
          items: { type: string }
    UpdateGatewayAPIKeyRequest:
      allOf:
        - $ref: '#/components/schemas/CreateGatewayAPIKeyRequest'
        - type: object
          required: [name, requestsPerMinute, monthlyTokenLimit, allowedModelCodes]
    GatewayAPIKey:
      type: object
      required: [id, name, keyPrefix, status, requestsPerMinute, monthlyTokenLimit, monthlyTokenUsed, allowedModelCodes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        keyPrefix: { type: string, description: 可安全展示的密钥前缀。 }
        status: { type: string, enum: [active, revoked] }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        requestsPerMinute: { type: integer, minimum: 0 }
        monthlyTokenLimit: { type: integer, format: int64, minimum: 0 }
        monthlyTokenUsed: { type: integer, format: int64, minimum: 0 }
        allowedModelCodes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    CreatedGatewayAPIKey:
      allOf:
        - $ref: '#/components/schemas/GatewayAPIKey'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, readOnly: true, description: 创建成功时返回的完整调用密钥；后续可通过密钥查看接口再次读取。 }
    GatewayCall:
      type: object
      required: [id, authType, requestId, modelCode, upstreamModelId, streaming, result, httpStatus, latencyMs, promptTokens, completionTokens, totalTokens, usageReported, quotaExceeded, errorCode, sourceIp, createdAt]
      properties:
        id: { type: string, format: uuid }
        authType: { type: string, enum: [api_key, user] }
        apiKeyId: { type: string, format: uuid, description: authType 为 api_key 时返回。 }
        apiKeyName: { type: string, description: authType 为 api_key 时返回。 }
        userId: { type: string, format: uuid, description: authType 为 user 时返回。 }
        userName: { type: string, description: authType 为 user 时返回。 }
        departmentId: { type: string, format: uuid, description: 调用发生时的部门标识；历史数据可能没有。 }
        requestId: { type: string }
        modelCode: { type: string }
        upstreamModelId: { type: string }
        streaming: { type: boolean }
        result: { type: string, enum: [success, failed] }
        httpStatus: { type: integer }
        latencyMs: { type: integer, format: int64 }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        totalTokens: { type: integer }
        usageReported: { type: boolean, description: 上游是否明确返回 Token 用量；false 时显示为未知。 }
        quotaExceeded: { type: boolean, description: 本次记账后是否超过调用身份的月度 Token 额度。 }
        errorCode: { type: string }
        sourceIp: { type: string }
        createdAt: { type: string, format: date-time }
    GatewayCallPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GatewayCall' }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    GatewayUsageGroup:
      type: object
      required: [id, name, callCount, knownTokens, unknownUsageCalls, overQuotaCalls]
      properties:
        id: { type: string, description: 部门或用户 UUID、模型编码；历史缺失部门时为空字符串。 }
        name: { type: string }
        callCount: { type: integer, format: int64 }
        knownTokens: { type: integer, format: int64 }
        unknownUsageCalls: { type: integer, format: int64 }
        overQuotaCalls: { type: integer, format: int64 }
    GatewayUsagePage:
      type: object
      required: [month, groupBy, callCount, knownTokens, unknownUsageCalls, overQuotaCalls, items, total, page, pageSize]
      properties:
        month: { type: string, description: UTC 月份，YYYY-MM。 }
        groupBy: { type: string, enum: [department, user, model] }
        callCount: { type: integer, format: int64 }
        knownTokens: { type: integer, format: int64 }
        unknownUsageCalls: { type: integer, format: int64 }
        overQuotaCalls: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/GatewayUsageGroup' }
        total: { type: integer, format: int64 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    GatewayAlert:
      type: object
      required: [id, month, dedupeKey, kind, subjectType, subjectName, severity, usedTokens, tokenLimit, callCount, unknownUsageCalls, firstDetectedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        month: { type: string, description: UTC 月份，YYYY-MM。 }
        dedupeKey: { type: string, description: 企业内当月唯一的预警对象键。 }
        kind: { type: string, enum: [quota, unknown_usage] }
        subjectType: { type: string, enum: [department, user, department_user, api_key, model] }
        subjectName: { type: string }
        severity: { type: string, enum: [warning, critical] }
        usedTokens: { type: integer, format: int64 }
        tokenLimit: { type: integer, format: int64 }
        callCount: { type: integer, format: int64 }
        unknownUsageCalls: { type: integer, format: int64 }
        firstDetectedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    GatewayAlertPage:
      type: object
      required: [month, activeCount, items, total, page, pageSize]
      properties:
        month: { type: string }
        activeCount: { type: integer, format: int64, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/GatewayAlert' }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    AuthUser:
