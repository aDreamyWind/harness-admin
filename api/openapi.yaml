          items: { $ref: '#/components/schemas/MCPConnection' }
    MCPUsageListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MCPUsage' }
    MCPUserConnectionListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MCPUserConnection' }
