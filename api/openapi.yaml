        scenes: { type: array, items: { $ref: '#/components/schemas/DramaAsset' } }
        props: { type: array, items: { $ref: '#/components/schemas/DramaAsset' } }
        episodes: { type: array, items: { $ref: '#/components/schemas/DramaEpisode' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MCPConnectionInput:
      type: object
      required: [serviceId, name, purpose, authMode]
      properties:
        serviceId: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$', description: 可选；省略时由服务端自动生成内部编码。 }
        name: { type: string, maxLength: 120 }
        purpose: { type: string, enum: [harness, developer] }
        authMode: { type: string, enum: [oidc, bearer, none] }
        applicationName: { type: string, maxLength: 120 }
        expiresAt: { type: string, format: date-time }
        upstreamParameters:
          type: array
          description: 当前连接的上游参数值；服务定义的必填字段必须在此提供。加密保存，不在连接列表回显。
          items: { $ref: '#/components/schemas/MCPParameterValue' }
        upstreamAuthorization: { type: string, description: 此连接专用的完整上游 Authorization 值，加密保存且不回显。 }
        upstreamHeaderName: { type: string, description: 此连接专用上游请求头名称；须与值同时填写。 }
        upstreamHeaderValue: { type: string, description: 此连接专用上游请求头密钥；加密保存。 }
        upstreamQueryName: { type: string, description: 此连接专用上游 URL 参数名称；须与值同时填写。 }
        upstreamQueryValue: { type: string, description: 此连接专用上游 URL 参数值；加密保存，可能出现在上游日志中。 }
        requestsPerMinute: { type: integer, minimum: 1, maximum: 100000, default: 60 }
        departmentIds: { type: array, items: { type: string, format: uuid } }
        userIds: { type: array, items: { type: string, format: uuid } }
    MCPUpstreamCredentials:
      type: object
      properties:
        parameters:
          type: array
          items: { $ref: '#/components/schemas/MCPParameterValue' }
        authorization: { type: string, description: 完整上游 Authorization 值。 }
        headerName: { type: string, description: 上游请求头名称。 }
        headerValue: { type: string, description: 上游请求头值。 }
        queryName: { type: string, description: 上游 URL 参数名称。 }
        queryValue: { type: string, description: 上游 URL 参数值。 }
