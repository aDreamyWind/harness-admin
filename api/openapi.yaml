openapi: 3.1.0
info:
  title: Harness Admin API
  version: 0.7.0
  description: Harness 企业控制面 HTTP API。
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: 登录管理端
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，同时写入会话与 CSRF Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: 账号因连续登录失败已被锁定，需要管理员解锁。
        '429':
          description: 登录失败次数过多。
  /auth/me:
    get:
      summary: 获取当前登录用户
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: 退出登录
      operationId: logout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 会话已吊销。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/password:
    put:
      summary: 修改当前账号密码
      description: 修改成功后保留当前会话，并吊销当前账号的其他会话。
      operationId: changeCurrentPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码已修改。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeEnvelope'
        '400':
          description: 密码参数不正确或当前密码错误。
        '409':
          description: 新密码与当前密码相同。
  /auth/sessions:
    get:
      summary: 查询当前账号的活跃会话
      operationId: listCurrentUserSessions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 未过期且未吊销的会话，当前会话优先返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionListEnvelope'
  /auth/sessions/{sessionId}:
    delete:
      summary: 吊销指定会话
      description: 只能吊销当前账号名下的非当前会话。
      operationId: revokeCurrentUserSession
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 会话已吊销。
        '404':
          description: 会话不存在或已经失效。
        '409':
          description: 不能通过会话管理吊销当前会话。
  /auth/sessions/revoke-others:
    post:
      summary: 吊销当前账号的其他会话
      operationId: revokeOtherCurrentUserSessions
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 其他会话已吊销，当前会话保持登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevocationEnvelope'
  /users:
    get:
      summary: 查询当前企业用户
      operationId: listUsers
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, locked, disabled]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页用户列表，需要 `iam.user.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 创建用户
      operationId: createUser
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 用户创建成功，需要 `iam.user.write` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 用户名或邮箱已存在。
  /users/{userId}:
    put:
      summary: 修改用户资料
      description: 修改显示名称和邮箱；登录用户名创建后不可修改。需要 `iam.user.write` 权限。
      operationId: updateUser
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 用户资料修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户不存在。
        '409':
          description: 邮箱已被当前企业内其他用户使用。
  /users/{userId}/status:
    patch:
      summary: 修改用户状态
      operationId: changeUserStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: 状态修改成功；停用时会吊销该用户全部会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '404':
          description: 用户不存在。
        '409':
          description: 不能停用当前登录账号；锁定用户必须使用解锁接口。
  /users/{userId}/password:
    put:
      summary: 重置用户密码
      description: 重置成功后吊销目标用户的全部会话；不能通过该接口重置当前登录账号。
      operationId: resetUserPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 密码已重置，需要 `iam.user.write` 权限。
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户不存在。
        '409':
          description: 不能重置当前登录账号的密码。
  /users/{userId}/unlock:
    post:
      summary: 解锁用户
      description: 清除目标账号的登录失败计数并恢复为正常状态，需要 `iam.user.write` 权限。
      operationId: unlockUser
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 用户已解锁，可以重新登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserEnvelope'
        '404':
          description: 用户不存在。
        '409':
          description: 用户当前未被锁定。
  /users/{userId}/roles:
    put:
      summary: 设置用户角色
      operationId: assignUserRoles
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: 用户角色已更新，需要 `iam.user.write` 权限。
        '404':
          description: 用户或角色不存在。
        '409':
          description: 不能修改当前登录账号的角色。
  /users/{userId}/department:
    patch:
      summary: 调整用户所属部门
      operationId: assignUserDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId]
              properties:
                departmentId:
                  type: string
                  description: 部门 UUID；空字符串表示清除部门归属。
      responses:
        '200':
          description: 用户部门已更新，需要 `iam.user.write` 权限。
        '404':
          description: 用户不存在。
  /organization:
    get:
      summary: 获取当前企业资料
      operationId: getOrganization
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前登录用户所属企业，需要 `iam.organization.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: 修改当前企业资料
      description: 仅修改企业展示名称；企业代码作为登录和数据隔离标识不可修改。需要 `iam.organization.write` 权限。
      operationId: updateOrganization
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: 企业资料修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 企业不存在。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /departments:
    get:
      summary: 查询当前企业部门
      operationId: listDepartments
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 部门平铺列表，通过 parentId 表达层级，需要 `iam.department.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentListEnvelope' }
    post:
      summary: 创建部门
      operationId: createDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartmentRequest' }
      responses:
        '201':
          description: 部门创建成功，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 部门代码已存在。
  /departments/{departmentId}:
    put:
      summary: 修改部门
      operationId: updateDepartment
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDepartmentRequest' }
      responses:
        '200':
          description: 部门已更新，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 不能移动到自身或下级部门。
  /departments/{departmentId}/status:
    patch:
      summary: 修改部门状态
      operationId: changeDepartmentStatus
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 部门状态已更新，需要 `iam.department.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentEnvelope' }
        '409':
          description: 部门下仍有启用中的子部门或用户。
  /roles:
    get:
      summary: 查询当前企业角色
      operationId: listRoles
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 角色列表，需要 `iam.role.read` 权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListEnvelope'
    post:
      summary: 创建角色
      operationId: createRole
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: 角色创建成功，需要 `iam.role.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '409':
          description: 角色代码已存在。
  /roles/{roleId}:
    put:
      summary: 修改自定义角色
      operationId: updateRole
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: 角色已更新，需要 `iam.role.write` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '409':
          description: 系统内置角色不允许修改。
  /permissions:
    get:
      summary: 查询系统权限定义
      operationId: listPermissions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 权限列表，需要 `iam.role.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionListEnvelope' }
  /audit-events:
    get:
      summary: 查询当前企业审计事件
      operationId: listAuditEvents
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: 模糊匹配动作、资源、请求 ID 或操作人。
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, denied, failed] }
        - name: startedAt
          in: query
          schema: { type: string, format: date-time }
        - name: endedAt
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页审计事件列表，需要 `audit.event.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventListEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-events/{eventId}:
    get:
      summary: 查询审计事件详情
      operationId: getAuditEvent
      security:
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: 当前企业内的审计事件详情，需要 `audit.event.read` 权限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventEnvelope' }
        '404':
          description: 审计事件不存在或不属于当前企业。
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: harness_admin_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    BadRequest:
      description: 请求参数不正确。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或会话已失效。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 权限不足或 CSRF 校验失败。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    LoginRequest:
      type: object
      required: [organizationCode, username, password]
      properties:
        organizationCode: { type: string }
        username: { type: string }
        password: { type: string, format: password }
    CreateUserRequest:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 80 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        departmentId: { type: string, format: uuid }
        password: { type: string, format: password, minLength: 3 }
    UpdateUserRequest:
      type: object
      required: [displayName, email]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email:
          type: string
          description: 电子邮箱；空字符串表示清除邮箱。
    UpdateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 3, maxLength: 1024 }
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 3, maxLength: 1024 }
    CreateRoleRequest:
      type: object
      required: [code, name, permissionCodes]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        permissionCodes:
          type: array
          items: { type: string }
    UpdateRoleRequest:
      type: object
      required: [name, permissionCodes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        permissionCodes:
          type: array
          items: { type: string }
    CreateDepartmentRequest:
      type: object
      required: [code, name, sortOrder]
      properties:
        parentId: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z][a-z0-9._-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
    UpdateDepartmentRequest:
      type: object
      required: [name, sortOrder]
      properties:
        parentId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 999999 }
    AuthUser:
      type: object
      required: [id, organizationId, organization, organizationCode, username, displayName, permissionCodes]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organization: { type: string }
        organizationCode: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        permissionCodes:
          type: array
          description: 当前用户通过角色获得的权限代码，已去重并按代码排序。
          items: { type: string }
    ManagedUser:
      type: object
      required: [id, username, displayName, status, roleIds, roleNames, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        departmentId: { type: string, format: uuid }
        departmentName: { type: string }
        status: { type: string, enum: [active, locked, disabled] }
        roleIds:
          type: array
          items: { type: string, format: uuid }
        roleNames:
          type: array
          items: { type: string }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, code, name, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Role:
      type: object
      required: [id, code, name, description, builtIn, userCount, permissionCodes, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        builtIn: { type: boolean }
        userCount: { type: integer, format: int64 }
        permissionCodes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    Permission:
      type: object
      required: [id, code, name, resource, action, description]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        resource: { type: string }
        action: { type: string }
        description: { type: string }
    Department:
      type: object
      required: [id, code, name, sortOrder, status, userCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        status: { type: string, enum: [active, disabled] }
        userCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, resourceType, result, detail, createdAt]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        actorId: { type: string, format: uuid }
        actorUsername: { type: string }
        actorDisplayName: { type: string }
        requestId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        result: { type: string, enum: [success, denied, failed] }
        sourceIp: { type: string }
        detail: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    UserSession:
      type: object
      required: [id, userAgent, expiresAt, lastSeenAt, createdAt, current]
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: string }
        sourceIp: { type: string }
        expiresAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        current: { type: boolean }
    AuditEventList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
    LoginResult:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    UserList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ManagedUser' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AuthUser' }
    LoginResponseEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/LoginResult' }
    PasswordChangeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [changed, revokedSessions]
          properties:
            changed: { type: boolean }
            revokedSessions: { type: integer, format: int64 }
    SessionRevocationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [revokedSessions]
          properties:
            revokedSessions: { type: integer, format: int64 }
    UserSessionListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserSession' }
    ManagedUserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ManagedUser' }
    UserListEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/UserList' }
    OrganizationEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Organization' }
    RoleEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Role' }
    RoleListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    PermissionListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    DepartmentEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Department' }
    DepartmentListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Department' }
    AuditEventEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AuditEvent' }
    AuditEventListEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AuditEventList' }
