            application/json:
              schema: { $ref: '#/components/schemas/MCPRuntimeStatusEnvelope' }
  /mcp-deployments/{serviceId}/metadata:
    put:
      summary: 修改托管 MCP 服务名称；描述始终来自当前版本 README.md
      operationId: updateMCPDeploymentMetadata
      security: [{ sessionCookie: [], csrfHeader: [] }]
