        '503': { description: 服务器未开启源码部署。 }
  /mcp-deployments/import/upload:
    post:
      summary: 上传代码包并构建 MCP
      operationId: importMCPFromUpload
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MCPUploadImportInput' }
      responses:
        '202':
          description: 服务与 building 构建记录已创建；后台执行构建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPDeploymentResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /mcp-deployments/{serviceId}/versions:
